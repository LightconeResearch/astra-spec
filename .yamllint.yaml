# Configuration for https://github.com/adrienverge/yamllint

extends: default

# What yamllint's loader refuses is the point of this fixture: it fails at
# parse (malformed YAML). Keep in step with check-yaml's exclude in
# .pre-commit-config.yaml.
ignore: |
  conformance/documents/invalid/Analysis-182-malformed-yaml.yaml

rules:
  document-start: disable  # Don't check if document has a start marker (---).
  line-length:
    max: 80
    level: warning
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  new-lines: disable  # Don't check for type of new line characters.
