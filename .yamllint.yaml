# Configuration for https://github.com/adrienverge/yamllint

extends: default

# What yamllint's loader refuses is the point of these fixtures and of the
# yaml-test-suite cases: failing at parse (a duplicate key, malformed YAML, a
# %YAML 1.1 directive, a local tag, a second document, bytes that aren't
# UTF-8, a C1 control outside quotes), and YAML 1.2's tabs and characters (a
# tab as white space, a C1 control or DEL in quotes, NEL as an ordinary
# character). Keep in step with check-yaml's exclude in
# .pre-commit-config.yaml.
ignore: |
  tests/data/invalid/Analysis-101-duplicate-output.yaml
  tests/data/invalid/Analysis-146-duplicate-universe.yaml
  tests/data/invalid/Analysis-182-malformed-yaml.yaml
  tests/data/invalid/Analysis-183-yaml-1-1-directive.yaml
  tests/data/invalid/Analysis-192-comment-glued-to-a-scalar.yaml
  tests/data/invalid/Analysis-193-flow-line-not-indented.yaml
  tests/data/invalid/Analysis-194-escape-beyond-unicode.yaml
  tests/data/invalid/Analysis-201-local-tag.yaml
  tests/data/invalid/Analysis-204-second-document.yaml
  tests/data/invalid/Analysis-211-not-utf-8.yaml
  tests/data/invalid/Analysis-212-c1-control-in-plain-scalar.yaml
  tests/data/valid/Analysis-010-tabs-as-separation.yaml
  tests/data/valid/Analysis-011-quoted-c1-and-del.yaml
  tests/data/valid/Analysis-012-nel-in-block-scalar.yaml
  tests/yaml-test-suite/

rules:
  document-start: disable  # Don't check if document has a start marker (---).
  line-length:
    max: 80
    level: warning
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  new-lines: disable  # Don't check for type of new line characters.
