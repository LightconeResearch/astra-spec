# Configuration for https://github.com/adrienverge/yamllint

extends: default

# Failing at parse (a duplicate key, malformed YAML, a %YAML 1.1 directive) is
# the point of these fixtures and of the yaml-test-suite error cases. Keep in
# step with check-yaml's exclude in .pre-commit-config.yaml.
ignore: |
  tests/data/invalid/Analysis-101-duplicate-output.yaml
  tests/data/invalid/Analysis-146-duplicate-universe.yaml
  tests/data/invalid/Analysis-182-malformed-yaml.yaml
  tests/data/invalid/Analysis-183-yaml-1-1-directive.yaml
  tests/data/invalid/Analysis-192-comment-glued-to-a-scalar.yaml
  tests/data/invalid/Analysis-193-flow-line-not-indented.yaml
  tests/data/invalid/Analysis-194-escape-beyond-unicode.yaml
  tests/yaml-test-suite/

rules:
  document-start: disable  # Don't check if document has a start marker (---).
  line-length:
    max: 80
    level: warning
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  new-lines: disable  # Don't check for type of new line characters.
