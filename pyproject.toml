# astra-spec is not a Python package: nothing is built from it or published to
# PyPI. This file holds the Python tools of the repository (the generators in
# tools/, the tests and the docs build), which uv installs from the groups below.
[tool.uv]
package = false

[project]
name = "astra-spec"
version = "0.0.0"  # a placeholder uv needs; releases are git tags (see `just release`)
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "linkml==1.12.1",
    "jsonschema>=4.23",
    "ruamel.yaml>=0.18",
    "pytest>=8",
    "markdown-it-py>=3",
    "rdflib>=7",
    # Pinned: tests/test_rules.py reads its standard output formats to check spec §10's filter.
    "jschon==0.11.1",
]
docs = [
    "zensical>=0.0.33; python_version >= '3.10'",
    "ghp-import>=2",
    # squidfunk's mike fork — required by zensical's versioning provider.
    # Not on PyPI; install from git.
    "mike @ git+https://github.com/squidfunk/mike.git ; python_version >= '3.10'",
]

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
# jschon (tests/test_rules.py) checks URIs through rfc3986's deprecated methods.
filterwarnings = [
  "ignore:Please use rfc3986.validators.Validator instead:DeprecationWarning",
]

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
]
