[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "astra-spec"
description = "ASTRA — Agentic Schema for Transparent Research Analysis: a declarative YAML format for reproducible, auditable, and composable scientific analyses."
readme = "README.md"
authors = [
  {name = "Francois Lanusse", email = "francois.lanusse@cnrs.fr"},
  {name = "Liam Parker", email = "lhparker@berkeley.edu"},
]
maintainers = [
  {name = "Francois Lanusse", email = "francois.lanusse@cnrs.fr"},
  {name = "Liam Parker", email = "lhparker@berkeley.edu"},
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
dynamic = ["version"]
keywords = [
  "astra",
  "linkml",
  "schema",
  "reproducibility",
  "open-science",
  "scientific-analysis",
  "agentic-ai",
  "declarative",
  "yaml",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = [
  "linkml-runtime >=1.9.4",
]

[project.urls]
Homepage = "https://astra-spec.org"
Documentation = "https://astra-spec.org"
Repository = "https://github.com/LightconeResearch/astra-spec"
Issues = "https://github.com/LightconeResearch/astra-spec/issues"
Changelog = "https://github.com/LightconeResearch/astra-spec/releases"
"Source Code" = "https://github.com/LightconeResearch/astra-spec"

[dependency-groups]
dev = [
    "linkml==1.12.1",
    "jsonschema>=4.23",
    "ruamel.yaml>=0.18",
    "pytest>=8",
    "markdown-it-py>=3",
    "rdflib>=7",
    # Pinned: tests/test_rules.py reads its standard output formats to check which errors fail a file.
    "jschon==0.11.1",
]
docs = [
    "zensical>=0.0.33; python_version >= '3.10'",
    "ghp-import>=2",
    # squidfunk's mike fork — required by zensical's versioning provider.
    # Not on PyPI; install from git.
    "mike @ git+https://github.com/squidfunk/mike.git ; python_version >= '3.10'",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src/astra",
  "/pyproject.toml",
  "/LICENSE",
  "/docs/llms.txt",
  "/project/jsonschema",
  "/project/jsonld",
  "/project/rules",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astra"]

# Ship the agent briefing inside the package so tooling (e.g. `astra guide`
# from astra-tools) can read the copy matching the installed schema.
# Ship the contract `just gen-schema` commits under project/, each LinkML
# generator's folder beside the LinkML sources in astra/schema/, where tools
# read it through importlib.resources (`files("astra.schema")`).
[tool.hatch.build.targets.wheel.force-include]
"docs/llms.txt" = "astra/docs/llms.txt"
"project/jsonschema" = "astra/schema/jsonschema"
"project/jsonld" = "astra/schema/jsonld"
"project/rules" = "astra/schema/rules"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Where a project installs astra-spec from a path (astra-tools does), uv
# rebuilds it only when a cache key changes, and pyproject.toml alone is the
# default. The wheel takes its version from git and copies in the
# force-included files (project/'s contract, docs/llms.txt), even into an
# editable install, so each of those is a key too.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
  { file = "project/**/*" },
  { file = "docs/llms.txt" },
]

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
# jschon (tests/test_rules.py) checks URIs through rfc3986's deprecated methods.
filterwarnings = [
  "ignore:Please use rfc3986.validators.Validator instead:DeprecationWarning",
]

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/astra/datamodel/astra_pydantic.py",
  "src/astra/datamodel/astra.py",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/astra/datamodel/astra_pydantic.py",
  "src/astra/datamodel/astra.py",
]
