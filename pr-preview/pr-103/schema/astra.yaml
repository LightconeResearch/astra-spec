classes:
  Resources:
    name: Resources
    definition_uri: https://w3id.org/astra/Resources
    description: The compute resources a recipe asks for.
    from_schema: https://w3id.org/astra/analysis
    slots:
    - resources__cpus
    - resources__memory
    - resources__time_limit
    - resources__disk
    - resources__gpus
    attributes:
      cpus:
        name: cpus
        description: The number of CPU cores the recipe asks for, which may be fractional,
          such as 0.5.
        range: float
        minimum_value: 0
      memory:
        name: memory
        description: The memory the recipe asks for, as free text, such as `4GB`.
      time_limit:
        name: time_limit
        description: The longest the recipe may run, as free text, such as `2h`.
      disk:
        name: disk
        description: The disk space the recipe asks for, as free text, such as `10GB`.
      gpus:
        name: gpus
        description: The number of GPUs the recipe asks for.
        range: integer
        minimum_value: 1
    class_uri: astra:Resources
  Recipe:
    name: Recipe
    definition_uri: https://w3id.org/astra/Recipe
    description: 'How an output is made: a `command` and the context it runs in (`resources`,
      `container`). What the output is made from, the decisions it is made with and
      when it is active are the output''s `inputs`, `decisions` and `when`; the command
      reaches the inputs and decisions through its placeholders.'
    from_schema: https://w3id.org/astra/analysis
    slots:
    - recipe__command
    - recipe__resources
    - recipe__container
    attributes:
      command:
        name: command
        description: "The POSIX shell command that makes the output, such as `python\
          \ src/output1.py`. It is a template. Read from the left, `{{` stands for\
          \ a literal `{` and `}}` for a literal `}`, and any other `{` opens a placeholder,\
          \ which ends at the next `}`. A runner substitutes each placeholder, and\
          \ each `{{` and `}}`, before running the command:\n\n  {inputs.<entry>}\
          \     the path of what an entry of the output's\n                      \
          \ `inputs` names, with <entry> written\n                       exactly as\
          \ the entry is, dots and `#`\n                       included, as in\n \
          \                      {inputs.subanalysis.output1#u1}\n  {decisions.<entry>}\
          \  the id of the option selected for the\n                       decision\
          \ an entry of the output's\n                       `decisions` names, with\
          \ <entry> written\n                       exactly as the entry is, as in\n\
          \                       {decisions.subanalysis.decision1}\n  {inputs}  \
          \           the paths of all the output's inputs, in\n                 \
          \      the order of `inputs`, separated by spaces\n  {output}          \
          \   the path the result is written to\n\nEvery brace belongs to a `{{`,\
          \ a `}}` or a placeholder, every placeholder takes one of these forms, and\
          \ the <entry> of an {inputs.<entry>} or {decisions.<entry>} is an entry\
          \ of the output's `inputs` or `decisions`, exactly as written."
        required: true
      resources:
        name: resources
        description: The compute resources the recipe asks for.
        range: Resources
        inlined: true
      container:
        name: container
        description: 'The container the recipe runs in: an image, or a Containerfile
          it is built from.'
    class_uri: astra:Recipe
  Input:
    name: Input
    definition_uri: https://w3id.org/astra/Input
    description: A file the analysis reads, tracked in git with it and named by its
      path.
    from_schema: https://w3id.org/astra/analysis
    slots:
    - input__id
    - input__label
    - input__description
    - input__tags
    - input__path
    attributes:
      id:
        name: id
        description: The input's id, written as its key in `inputs`.
        key: true
        range: id
      label:
        name: label
        description: A short display name for the input.
      description:
        name: description
        description: What the input's data is, in free prose.
      tags:
        name: tags
        description: Keywords for grouping and finding the input.
        multivalued: true
        minimum_cardinality: 1
      path:
        name: path
        annotations:
          rule:
            tag: rule
            value: INVALID_PATH
        description: The path of the input's file, relative to the folder of the `astra.yaml`,
          with `/` between folders. It is non-empty and doesn't start with `/`.
        required: true
        pattern: ^[^/]
    class_uri: astra:Input
  Output:
    name: Output
    definition_uri: https://w3id.org/astra/Output
    description: 'An artefact the analysis makes, such as a metric, a figure or a
      table: what it is, what it is made from, and how.'
    from_schema: https://w3id.org/astra/analysis
    slots:
    - output__id
    - output__label
    - output__description
    - output__tags
    - output__type
    - output__format
    - output__inputs
    - output__decisions
    - output__when
    - output__recipe
    attributes:
      id:
        name: id
        description: The output's id, written as its key in `outputs`.
        key: true
        range: id
      label:
        name: label
        description: A short display name for the output.
      description:
        name: description
        description: What the output is, in free prose.
      tags:
        name: tags
        description: Keywords for grouping and finding the output.
        multivalued: true
        minimum_cardinality: 1
      type:
        name: type
        description: The kind of artefact the output is.
        range: OutputType
        required: true
      format:
        name: format
        annotations:
          rule:
            tag: rule
            value: INVALID_VALUE
        description: 'How the output''s artefact is encoded, as a lowercase token:
          the extension of its results'' files, without the leading dot, such as `png`,
          `csv` or `parquet`.'
        required: true
        pattern: ^[a-z0-9][a-z0-9_.+-]*$
      inputs:
        name: inputs
        description: 'What the output is made from, in order: references to inputs
          and outputs of the analysis or of analyses it declares. A reference can
          be pinned to a universe with `#`.'
        range: reference
        multivalued: true
        minimum_cardinality: 1
      decisions:
        name: decisions
        description: 'The addresses of the decisions whose option the output is made
          with directly, not through what it reads: a different option for any of
          them, in the universe being built, can give a different result.'
        range: address
        multivalued: true
        minimum_cardinality: 1
      when:
        name: when
        description: The conditions under which the output is active. It is active
          only when every condition holds.
        range: condition
        multivalued: true
        minimum_cardinality: 1
      recipe:
        name: recipe
        description: How the output is made.
        range: Recipe
        required: true
        inlined: true
    class_uri: astra:Output
  Decision:
    name: Decision
    definition_uri: https://w3id.org/astra/Decision
    description: A choice the analysis makes between options, such as which method
      to use.
    from_schema: https://w3id.org/astra/analysis
    slots:
    - decision__id
    - decision__label
    - decision__rationale
    - decision__tags
    - decision__when
    - decision__options
    attributes:
      id:
        name: id
        description: The decision's id, written as its key in `decisions`.
        key: true
        range: id
      label:
        name: label
        description: A short display name for the decision.
      rationale:
        name: rationale
        description: Why the analysis makes this decision, in free prose.
      tags:
        name: tags
        description: Keywords for grouping and finding the decision.
        multivalued: true
        minimum_cardinality: 1
      when:
        name: when
        description: The conditions under which the decision is active. It is active
          only when every condition holds.
        range: condition
        multivalued: true
        minimum_cardinality: 1
      options:
        name: options
        description: The options the decision chooses between, keyed by id. There
          is at least one.
        range: Option
        required: true
        multivalued: true
        inlined: true
        minimum_cardinality: 1
    class_uri: astra:Decision
  Option:
    name: Option
    definition_uri: https://w3id.org/astra/Option
    description: One of the options a decision chooses between.
    from_schema: https://w3id.org/astra/analysis
    slots:
    - option__id
    - option__label
    - option__description
    - option__tags
    - option__insights
    - option__requires
    - option__incompatible_with
    - option__excluded
    attributes:
      id:
        name: id
        description: The option's id, written as its key in `options`.
        key: true
        range: id
      label:
        name: label
        description: A short display name for the option.
      description:
        name: description
        description: What the option is, in free prose.
      tags:
        name: tags
        description: Keywords for grouping and finding the option.
        multivalued: true
        minimum_cardinality: 1
      insights:
        name: insights
        description: The ids of the prior insights that support the option.
        range: id
        multivalued: true
        minimum_cardinality: 1
      requires:
        name: requires
        description: The options that are also selected whenever this option is.
        range: option_reference
        multivalued: true
        minimum_cardinality: 1
      incompatible_with:
        name: incompatible_with
        description: The options that are never selected together with this option.
        range: option_reference
        multivalued: true
        minimum_cardinality: 1
      excluded:
        name: excluded
        description: 'Why the option is ruled out. An option with a reason is excluded:
          no effective selection selects it.'
    class_uri: astra:Option
  Universe:
    name: Universe
    definition_uri: https://w3id.org/astra/Universe
    description: 'An entry of `universes`: a universe of the analysis, a selection
      of one option for every active decision of the analysis and of every analysis
      reached through a declaration that the analysis''s universes drive, or an import,
      which has an `analysis` and a `universe`, names one of another analysis''s universes
      and selects nothing. A universe''s effective selection is the effective selection
      of the universe it is derived from, if any, with its own `decisions` written
      over it decision by decision and every inherited selection of a decision that
      isn''t active in the result dropped, so a universe that switches a decision
      on must set it.'
    from_schema: https://w3id.org/astra/analysis
    slots:
    - universe__id
    - universe__label
    - universe__description
    - universe__tags
    - universe__derived_from
    - universe__decisions
    - universe__analysis
    - universe__universe
    attributes:
      id:
        name: id
        description: 'The entry''s id, written as its key in `universes`: for an import,
          the id the analysis gives the universe it imports.'
        key: true
        range: id
      label:
        name: label
        description: A short display name for the universe.
      description:
        name: description
        description: What the universe is, in free prose.
      tags:
        name: tags
        description: Keywords for grouping and finding the universe.
        multivalued: true
        minimum_cardinality: 1
      derived_from:
        name: derived_from
        description: The id of another universe of the analysis, never an import,
          whose effective selection this universe's effective selection is built on,
          so that this universe gives only the decisions it changes. The universe
          inherits only that selection.
        range: id
      decisions:
        name: decisions
        description: 'The options the universe selects, as `<decision>: <option>`,
          one key per decision. Each key is the id of a decision of the analysis or,
          for a decision of another analysis, a flat key: the decision''s address
          through the declarations, `<declaration>.<decision>`, such as `subanalysis.decision1`,
          or another spelling of that address, through no declaration back to an analysis
          already on its chain.'
        range: DecisionSelection
        multivalued: true
        inlined: true
      analysis:
        name: analysis
        description: For an import, the address of the declaration that leads to the
          analysis whose universe it imports, through as many declarations as lead
          to it, such as `subanalysis` or `stage.inner`.
        range: address
      universe:
        name: universe
        description: 'For an import, the id of the universe it imports: a universe
          of the analysis that `analysis` leads to, never an import of that analysis.'
        range: id
    class_uri: astra:Universe
    rules:
    - preconditions:
        slot_conditions:
          analysis:
            name: analysis
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          universe:
            name: universe
            value_presence: PRESENT
      annotations:
        rule:
          tag: rule
          value: INVALID_IMPORT
      description: An import has a `universe`.
    - preconditions:
        slot_conditions:
          analysis:
            name: analysis
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          decisions:
            name: decisions
            value_presence: ABSENT
      annotations:
        rule:
          tag: rule
          value: INVALID_IMPORT
      description: An import has no `decisions`.
    - preconditions:
        slot_conditions:
          analysis:
            name: analysis
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          derived_from:
            name: derived_from
            value_presence: ABSENT
      annotations:
        rule:
          tag: rule
          value: INVALID_IMPORT
      description: An import has no `derived_from`.
    - preconditions:
        slot_conditions:
          universe:
            name: universe
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          analysis:
            name: analysis
            value_presence: PRESENT
      annotations:
        rule:
          tag: rule
          value: INVALID_IMPORT
      description: An entry with a `universe` has an `analysis`.
  DecisionSelection:
    name: DecisionSelection
    definition_uri: https://w3id.org/astra/DecisionSelection
    description: 'The option a universe selects for one decision, written in the universe''s
      `decisions` as `<decision>: <option>`, such as `decision1: a`.'
    from_schema: https://w3id.org/astra/analysis
    slots:
    - decisionSelection__decision
    - decisionSelection__option
    attributes:
      decision:
        name: decision
        annotations:
          rule:
            tag: rule
            value: INVALID_ID
        description: The address of the decision, written as its key in the universe's
          `decisions`.
        key: true
        range: address
      option:
        name: option
        description: The id of the option selected for the decision.
        range: id
        required: true
    class_uri: astra:DecisionSelection
  AnalysisDeclaration:
    name: AnalysisDeclaration
    definition_uri: https://w3id.org/astra/AnalysisDeclaration
    description: An analysis that this analysis uses, found by exactly one of `path`
      and `url`. Its elements are addressed through the declaration's id, as `<declaration>.<element>`.
    from_schema: https://w3id.org/astra/analysis
    slots:
    - analysisDeclaration__id
    - analysisDeclaration__path
    - analysisDeclaration__url
    - analysisDeclaration__commit
    attributes:
      id:
        name: id
        description: The id this analysis addresses the declared analysis by, written
          as its key in `analyses`.
        key: true
        range: id
      path:
        name: path
        annotations:
          rule:
            tag: rule
            value: INVALID_PATH
        description: The directory of the declared analysis's `astra.yaml`, relative
          to the folder of this `astra.yaml`, with `/` between folders. It is non-empty
          and doesn't start with `/`.
        pattern: ^[^/]
      url:
        name: url
        annotations:
          rule:
            tag: rule
            value: INVALID_VALUE
        description: 'Where git fetches another repository from, as a remote with
          no ASCII space or control character, in one of two forms: `scheme://` and
          at least one character, where the scheme is an ASCII letter followed by
          any ASCII letters, digits, `+`, `.` and `-`, such as `https://example.org/remote.git`
          or `file:///srv/remote.git`; or scp-like, `[user@]host:path`, where `host`,
          `path` and any `user` are non-empty, `user` and `host` hold no `/`, `@`
          or `:`, and the value doesn''t start with a scheme and `://`, such as `git@example.org:remote.git`.
          The declared analysis is the one at the top level of that repository, at
          `commit`.'
        pattern: ^(?:[A-Za-z][A-Za-z0-9+.-]*://[^\x00-\x20\x7f]+|(?![A-Za-z][A-Za-z0-9+.-]*://)(?:[^\x00-\x20\x7f/@:]+@)?[^\x00-\x20\x7f/@:]+:[^\x00-\x20\x7f]+)$
      commit:
        name: commit
        description: The full id of the commit the declared analysis is read at. A
          declaration with a `url` has one; with a `path`, it declares the analysis
          at that path as it was at that commit.
        range: commit_id
    class_uri: astra:AnalysisDeclaration
    rules:
    - preconditions:
        slot_conditions:
          url:
            name: url
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          commit:
            name: commit
            value_presence: PRESENT
      annotations:
        rule:
          tag: rule
          value: URL_WITHOUT_COMMIT
      description: A declaration with a `url` has a `commit`.
    exactly_one_of:
    - annotations:
        rule:
          tag: rule
          value: INVALID_DECLARATION_SOURCE
      slot_conditions:
        path:
          name: path
          required: true
    - annotations:
        rule:
          tag: rule
          value: INVALID_DECLARATION_SOURCE
      slot_conditions:
        url:
          name: url
          required: true
  Analysis:
    name: Analysis
    definition_uri: https://w3id.org/astra/Analysis
    description: 'An analysis: the files it reads, the artefacts it makes and the
      decisions it makes along the way. It is the content of an `astra.yaml` file.'
    from_schema: https://w3id.org/astra/analysis
    slots:
    - analysis__spec_version
    - analysis__label
    - analysis__description
    - analysis__tags
    - analysis__inputs
    - analysis__outputs
    - analysis__decisions
    - analysis__analyses
    - analysis__universes
    - analysis__prior_insights
    - analysis__findings
    - analysis__container
    attributes:
      spec_version:
        name: spec_version
        description: The version of the ASTRA specification the document is written
          against, such as `0.1.0`.
        range: spec_version
        required: true
      label:
        name: label
        description: A short display name for the analysis.
      description:
        name: description
        description: What the analysis does, in free prose.
      tags:
        name: tags
        description: Keywords for grouping and finding the analysis.
        multivalued: true
        minimum_cardinality: 1
      inputs:
        name: inputs
        description: The files the analysis reads, keyed by id.
        range: Input
        multivalued: true
        inlined: true
      outputs:
        name: outputs
        description: The artefacts the analysis makes, keyed by id. There is at least
          one.
        range: Output
        required: true
        multivalued: true
        inlined: true
        minimum_cardinality: 1
      decisions:
        name: decisions
        description: The choices the analysis makes, keyed by id.
        range: Decision
        multivalued: true
        inlined: true
      analyses:
        name: analyses
        description: The analyses this analysis uses, keyed by the id it addresses
          them by.
        range: AnalysisDeclaration
        multivalued: true
        inlined: true
      universes:
        name: universes
        description: The universes of the analysis, and the universes of other analyses
          it imports, keyed by id. An import has an `analysis` and a `universe`.
        range: Universe
        multivalued: true
        inlined: true
      prior_insights:
        name: prior_insights
        description: What earlier work establishes and the analysis builds on, as
          insights keyed by id. Options cite them in their `insights`.
        range: Insight
        multivalued: true
        inlined: true
      findings:
        name: findings
        description: What the analysis concludes, as insights keyed by id.
        range: Insight
        multivalued: true
        inlined: true
      container:
        name: container
        description: 'The default container of the analysis''s recipes: an image,
          or a Containerfile it is built from.'
    class_uri: astra:Analysis
    tree_root: true
  TextQuoteSelector:
    name: TextQuoteSelector
    definition_uri: https://w3id.org/astra/TextQuoteSelector
    description: A passage of the cited work or output, quoted exactly, with the text
      just before and after it to tell it apart where the same words occur more than
      once.
    from_schema: https://w3id.org/astra/insight
    exact_mappings:
    - oa:TextQuoteSelector
    slots:
    - textQuoteSelector__exact
    - textQuoteSelector__prefix
    - textQuoteSelector__suffix
    attributes:
      exact:
        name: exact
        description: The passage, exactly as the cited work or output writes it.
        slot_uri: oa:exact
        required: true
      prefix:
        name: prefix
        description: The text that comes just before the passage.
        slot_uri: oa:prefix
      suffix:
        name: suffix
        description: The text that comes just after the passage.
        slot_uri: oa:suffix
    class_uri: oa:TextQuoteSelector
  FragmentSelector:
    name: FragmentSelector
    definition_uri: https://w3id.org/astra/FragmentSelector
    description: "A place in the cited work or output, given as a fragment identifier\
      \ in the syntax `conforms_to` names, such as `row=5-7` in a CSV (RFC 7111).\
      \ Without `conforms_to`, it is a PDF fragment identifier (RFC 8118 \xA73), such\
      \ as `page=6`, with pages counted from 1."
    from_schema: https://w3id.org/astra/insight
    exact_mappings:
    - oa:FragmentSelector
    slots:
    - fragmentSelector__value
    - fragmentSelector__conforms_to
    attributes:
      value:
        name: value
        annotations:
          rule:
            tag: rule
            value: INVALID_VALUE
        description: The fragment identifier, without the leading `#`, such as `page=6`.
          It is non-empty, holds no ASCII space or control character and none of `"`,
          `#`, `<`, `>`, `[`, `\`, `]`, `^`, the backtick, `{`, `|` and `}`, and has
          `%` only before two hex digits.
        slot_uri: rdf:value
        required: true
        pattern: ^([^\x00-\x20\x7f"#%<>\[\\\]^`{|}]|%[0-9A-Fa-f]{2})+$
      conforms_to:
        name: conforms_to
        description: The IRI of the specification of the fragment syntax `value` follows,
          as W3C Web Annotation gives it, such as `http://tools.ietf.org/rfc/rfc7111`
          for a CSV. Without it, `value` is a PDF fragment identifier (RFC 8118).
        slot_uri: dcterms:conformsTo
        range: iri
    class_uri: oa:FragmentSelector
  Evidence:
    name: Evidence
    definition_uri: https://w3id.org/astra/Evidence
    description: 'What a claim rests on: a published work, cited by its `doi`, or
      an output, cited as an `artifact`. It has exactly one of the two, and a `version`
      only with a `doi`.'
    from_schema: https://w3id.org/astra/insight
    slots:
    - evidence__doi
    - evidence__artifact
    - evidence__version
    - evidence__quote
    - evidence__location
    attributes:
      doi:
        name: doi
        annotations:
          rule:
            tag: rule
            value: INVALID_VALUE
        description: 'The DOI name of the cited work, under the `10` directory: `10.`,
          the registrant code, `/` and a non-empty suffix, such as `10.5555/12345678`.'
        pattern: ^10\.[0-9]+(\.[0-9]+)*/(?!$)
      artifact:
        name: artifact
        description: A reference to the cited output, written as in an output's `inputs`.
          It may pin the output to a universe, the one the claim is about, such as
          `output1#u1`.
        range: reference
      version:
        name: version
        description: The version of the cited work, counted from 1, such as `2` for
          the second version of an arXiv paper.
        range: integer
        minimum_value: 1
      quote:
        name: quote
        description: The passage of the cited work or output the claim rests on. With
          a `location`, the passage is sought within that place.
        range: TextQuoteSelector
        inlined: true
      location:
        name: location
        description: The place in the cited work or output the claim rests on, such
          as `page=6`.
        range: FragmentSelector
        inlined: true
    class_uri: astra:Evidence
    rules:
    - preconditions:
        slot_conditions:
          doi:
            name: doi
            value_presence: ABSENT
      postconditions:
        slot_conditions:
          version:
            name: version
            value_presence: ABSENT
      annotations:
        rule:
          tag: rule
          value: INVALID_EVIDENCE_SOURCE
      description: Evidence without a `doi` has no `version`.
    exactly_one_of:
    - annotations:
        rule:
          tag: rule
          value: INVALID_EVIDENCE_SOURCE
      slot_conditions:
        doi:
          name: doi
          required: true
    - annotations:
        rule:
          tag: rule
          value: INVALID_EVIDENCE_SOURCE
      slot_conditions:
        artifact:
          name: artifact
          required: true
  Insight:
    name: Insight
    definition_uri: https://w3id.org/astra/Insight
    description: 'A claim backed by evidence: as a prior insight, what earlier work
      establishes and the analysis builds on; as a finding, what the analysis concludes.'
    from_schema: https://w3id.org/astra/insight
    slots:
    - insight__id
    - insight__label
    - insight__claim
    - insight__description
    - insight__evidence
    - insight__scope
    - insight__tags
    attributes:
      id:
        name: id
        description: The insight's id, written as its key in `prior_insights` or `findings`.
        key: true
        range: id
      label:
        name: label
        description: A short display name for the insight.
      claim:
        name: claim
        description: What the insight asserts.
        required: true
      description:
        name: description
        description: The reasoning behind the claim, in free prose.
      evidence:
        name: evidence
        description: What the claim rests on, as a list. There is at least one.
        range: Evidence
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      scope:
        name: scope
        description: The conditions under which the claim holds, in free prose.
      tags:
        name: tags
        description: Keywords for grouping and finding the insight.
        multivalued: true
        minimum_cardinality: 1
    class_uri: astra:Insight
