name: analysis
description: 'Agentic Schema for Transparent Research Analysis.

  The analysis document, `astra.yaml`: the files an analysis reads, the

  artefacts it makes, and the decisions it makes along the way.'
title: ASTRA
id: https://w3id.org/astra/analysis
version: dev
imports:
- linkml:types
- types
- insight
license: https://creativecommons.org/licenses/by/4.0/
prefixes:
  astra:
    prefix_prefix: astra
    prefix_reference: https://w3id.org/astra/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
default_prefix: astra
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  id:
    name: id
    definition_uri: https://w3id.org/astra/Id
    annotations:
      rule:
        tag: rule
        value: INVALID_ID
    description: "An id: a lowercase ASCII letter, then any number of lowercase ASCII\
      \ letters, ASCII digits (`0`\u2013`9`) and underscores, such as `input1`."
    from_schema: https://w3id.org/astra/types
    typeof: string
    base: str
    uri: xsd:string
    structured_pattern:
      syntax: ^{id}$
      interpolated: true
      partial_match: true
  address:
    name: address
    definition_uri: https://w3id.org/astra/Address
    annotations:
      rule:
        tag: rule
        value: INVALID_REFERENCE
    description: 'The address of an element: the ids of the declared analyses that
      lead to it, if any, then the element''s own id, joined by `.`, such as `subanalysis.decision1`.'
    from_schema: https://w3id.org/astra/types
    typeof: string
    base: str
    uri: xsd:string
    structured_pattern:
      syntax: ^{id}(\.{id})*$
      interpolated: true
      partial_match: true
  reference:
    name: reference
    definition_uri: https://w3id.org/astra/Reference
    annotations:
      rule:
        tag: rule
        value: INVALID_REFERENCE
    description: 'A reference to an element: its address, optionally followed by `#`
      and a universe id, which pins the reference to that universe, such as `output1#u1`.
      In an `astra.yaml`, the id is that of an entry of the file''s `universes` or,
      where the file has no entry with that id, of a universe of the analysis whose
      element the reference names.'
    from_schema: https://w3id.org/astra/types
    typeof: string
    base: str
    uri: xsd:string
    structured_pattern:
      syntax: ^{id}(\.{id})*(#{id})?$
      interpolated: true
      partial_match: true
  option_reference:
    name: option_reference
    definition_uri: https://w3id.org/astra/OptionReference
    annotations:
      rule:
        tag: rule
        value: INVALID_REFERENCE
    description: 'A reference to an option: the address of its decision, then `.`
      and the option''s id. The last segment is always the option, so `subanalysis.decision1.a`
      is the option `a` of the decision `decision1` of the declared analysis `subanalysis`.'
    from_schema: https://w3id.org/astra/types
    typeof: string
    base: str
    uri: xsd:string
    structured_pattern:
      syntax: ^{id}(\.{id})+$
      interpolated: true
      partial_match: true
  condition:
    name: condition
    definition_uri: https://w3id.org/astra/Condition
    annotations:
      rule:
        tag: rule
        value: INVALID_REFERENCE
    description: An option reference, optionally preceded by `~`. Without `~` it holds
      when that option is selected; with `~` it holds when that option is not selected.
    from_schema: https://w3id.org/astra/types
    typeof: string
    base: str
    uri: xsd:string
    structured_pattern:
      syntax: ^~?{id}(\.{id})+$
      interpolated: true
      partial_match: true
  commit_id:
    name: commit_id
    definition_uri: https://w3id.org/astra/CommitId
    annotations:
      rule:
        tag: rule
        value: INVALID_COMMIT
    description: 'A full git commit id: 40 lowercase hexadecimal digits (SHA-1) or
      64 (SHA-256).'
    from_schema: https://w3id.org/astra/types
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
  content_hash:
    name: content_hash
    definition_uri: https://w3id.org/astra/ContentHash
    annotations:
      rule:
        tag: rule
        value: INVALID_VALUE
    description: 'A SHA-256 digest of content: `sha256:` followed by 64 lowercase
      hexadecimal digits.'
    from_schema: https://w3id.org/astra/types
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^sha256:[0-9a-f]{64}$
  spec_version:
    name: spec_version
    definition_uri: https://w3id.org/astra/SpecVersion
    annotations:
      rule:
        tag: rule
        value: INVALID_VALUE
    description: 'A version of the ASTRA specification, `MAJOR.MINOR.PATCH`: three
      non-negative integers without leading zeros, joined by `.`, such as `0.1.0`.'
    from_schema: https://w3id.org/astra/types
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
  timestamp:
    name: timestamp
    definition_uri: https://w3id.org/astra/Timestamp
    annotations:
      rule:
        tag: rule
        value: INVALID_VALUE
    description: "A date and time in UTC to the millisecond, written `YYYY-MM-DDThh:mm:ss.sssZ`,\
      \ with month 01\u201312, day 01\u201331, hour 00\u201323, and minute and second\
      \ 00\u201359, such as `2026-10-26T14:00:00.000Z`."
    from_schema: https://w3id.org/astra/types
    typeof: string
    base: str
    uri: xsd:dateTime
    pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{3}Z$
  iri:
    name: iri
    definition_uri: https://w3id.org/astra/Iri
    annotations:
      rule:
        tag: rule
        value: INVALID_VALUE
    description: "An IRI, never a CURIE: a scheme (an ASCII letter, then any ASCII\
      \ letters, digits, `+`, `.` and `-`), `:`, at least one character other than\
      \ `#`, then optionally `#` and any characters other than `#`, such as `http://tools.ietf.org/rfc/rfc7111`.\
      \ None of these characters is an ASCII space or control, a C1 control, `<`,\
      \ `>`, `\"`, `{`, `}`, the vertical bar, `\\`, `^`, the backtick or a bidi formatting\
      \ character U+200E, U+200F or U+202A\u2013U+202E, and `%` comes only before\
      \ two hex digits."
    from_schema: https://w3id.org/astra/types
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[A-Za-z][A-Za-z0-9+.-]*:([^\x00-\x20\x7f-\x9f<>"{}|\\^`%#\u200e\u200f\u202a-\u202e]|%[0-9A-Fa-f]{2})+(#([^\x00-\x20\x7f-\x9f<>"{}|\\^`%#\u200e\u200f\u202a-\u202e]|%[0-9A-Fa-f]{2})*)?$
enums:
  OutputType:
    name: OutputType
    definition_uri: https://w3id.org/astra/OutputType
    description: The kind of artefact an output is.
    from_schema: https://w3id.org/astra/analysis
    permissible_values:
      metric:
        text: metric
        description: A metric or measurement.
      figure:
        text: figure
        description: A figure or visualisation.
      table:
        text: table
        description: A table of data.
      data:
        text: data
        description: A data file or dataset.
      report:
        text: report
        description: A report or document.
slots:
  resources__cpus:
    name: resources__cpus
    description: The number of CPU cores the recipe asks for, which may be fractional,
      such as 0.5.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:cpus
    alias: cpus
    owner: Resources
    domain_of:
    - Resources
    range: float
    minimum_value: 0
  resources__memory:
    name: resources__memory
    description: The memory the recipe asks for, as free text, such as `4GB`.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:memory
    alias: memory
    owner: Resources
    domain_of:
    - Resources
    range: string
  resources__time_limit:
    name: resources__time_limit
    description: The longest the recipe may run, as free text, such as `2h`.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:time_limit
    alias: time_limit
    owner: Resources
    domain_of:
    - Resources
    range: string
  resources__disk:
    name: resources__disk
    description: The disk space the recipe asks for, as free text, such as `10GB`.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:disk
    alias: disk
    owner: Resources
    domain_of:
    - Resources
    range: string
  resources__gpus:
    name: resources__gpus
    description: The number of GPUs the recipe asks for.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:gpus
    alias: gpus
    owner: Resources
    domain_of:
    - Resources
    range: integer
    minimum_value: 1
  recipe__command:
    name: recipe__command
    description: "The POSIX shell command that makes the output, such as `python src/output1.py`.\
      \ It is a template. Read from the left, `{{` stands for a literal `{` and `}}`\
      \ for a literal `}`, and any other `{` opens a placeholder, which ends at the\
      \ next `}`. A runner substitutes each placeholder, and each `{{` and `}}`, before\
      \ running the command:\n\n  {inputs.<entry>}     the path of what an entry of\
      \ the output's\n                       `inputs` names, with <entry> written\n\
      \                       exactly as the entry is, dots and `#`\n            \
      \           included, as in\n                       {inputs.subanalysis.output1#u1}\n\
      \  {decisions.<entry>}  the id of the option selected for the\n            \
      \           decision an entry of the output's\n                       `decisions`\
      \ names, with <entry> written\n                       exactly as the entry is,\
      \ as in\n                       {decisions.subanalysis.decision1}\n  {inputs}\
      \             the paths of all the output's inputs, in\n                   \
      \    the order of `inputs`, separated by spaces\n  {output}             the\
      \ path the result is written to\n\nEvery brace belongs to a `{{`, a `}}` or\
      \ a placeholder, every placeholder takes one of these forms, and the <entry>\
      \ of an {inputs.<entry>} or {decisions.<entry>} is an entry of the output's\
      \ `inputs` or `decisions`, exactly as written."
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:command
    alias: command
    owner: Recipe
    domain_of:
    - Recipe
    range: string
    required: true
  recipe__resources:
    name: recipe__resources
    description: The compute resources the recipe asks for.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:resources
    alias: resources
    owner: Recipe
    domain_of:
    - Recipe
    range: Resources
    inlined: true
    inlined_as_list: true
  recipe__container:
    name: recipe__container
    description: 'The container the recipe runs in: an image, or a Containerfile it
      is built from.'
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:container
    alias: container
    owner: Recipe
    domain_of:
    - Recipe
    range: string
  input__id:
    name: input__id
    description: The input's id, written as its key in `inputs`.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:id
    key: true
    alias: id
    owner: Input
    domain_of:
    - Input
    range: id
    required: true
  input__label:
    name: input__label
    description: A short display name for the input.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:label
    alias: label
    owner: Input
    domain_of:
    - Input
    range: string
  input__description:
    name: input__description
    description: What the input's data is, in free prose.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:description
    alias: description
    owner: Input
    domain_of:
    - Input
    range: string
  input__tags:
    name: input__tags
    description: Keywords for grouping and finding the input.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:tags
    alias: tags
    owner: Input
    domain_of:
    - Input
    range: string
    multivalued: true
    minimum_cardinality: 1
  input__path:
    name: input__path
    annotations:
      rule:
        tag: rule
        value: INVALID_PATH
    description: The path of the input's file, relative to the folder of the `astra.yaml`,
      with `/` between folders. It is non-empty and doesn't start with `/`.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:path
    alias: path
    owner: Input
    domain_of:
    - Input
    range: string
    required: true
    pattern: ^[^/]
  output__id:
    name: output__id
    description: The output's id, written as its key in `outputs`.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:id
    key: true
    alias: id
    owner: Output
    domain_of:
    - Output
    range: id
    required: true
  output__label:
    name: output__label
    description: A short display name for the output.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:label
    alias: label
    owner: Output
    domain_of:
    - Output
    range: string
  output__description:
    name: output__description
    description: What the output is, in free prose.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:description
    alias: description
    owner: Output
    domain_of:
    - Output
    range: string
  output__tags:
    name: output__tags
    description: Keywords for grouping and finding the output.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:tags
    alias: tags
    owner: Output
    domain_of:
    - Output
    range: string
    multivalued: true
    minimum_cardinality: 1
  output__type:
    name: output__type
    description: The kind of artefact the output is.
    from_schema: https://w3id.org/astra/analysis
    slot_uri: astra:type
    alias: type
    owner: Output
    domain_of:
    - Output
    range: OutputType
    required: true
  output__format:
    name: output__format
    annotations:
      rule:
        tag: rule
        value: INVALID_VALUE
    description: 'How the output''s artefact is encoded, as a lowercase token: the
      extension of its results'' files, without the leading dot, such as `png`, `csv`
      or `parquet`.'
