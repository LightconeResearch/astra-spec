spec_version: "0.1.0"
decisions:
  decision1:
    options:
      a: {}
      b: {}
      c:
        excluded: It needs data this analysis doesn't have.
outputs:
  output1:
    type: data
    format: csv
    recipe:
      command: python make.py output1 '{output}'
  switch1:
    switch: decision1
    cases: {a: output1, c: output1}
  output2:
    type: data
    format: csv
    inputs: [switch1]
    recipe:
      command: python make.py '{inputs.switch1}' '{output}'
  output3:
    type: table
    format: csv
    inputs: [output2#u1]
    recipe:
      command: python make.py '{inputs.output2#u1}' '{output}'
universes:
  u1:
    decisions: {decision1: c}
