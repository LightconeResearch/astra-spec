spec_version: "0.1.0"
decisions:
  decision1:
    options:
      a: {}
      b:
        requires: [decision2.b]
  decision2:
    options: {a: {}, b: {}}
  decision3:
    options: {a: {}, b: {}}
outputs:
  output1:
    type: data
    format: csv
    decisions: [decision1, decision2]
    recipe:
      command: >-
        python make.py '{decisions.decision1}' '{decisions.decision2}'
        '{output}'
  output2:
    type: data
    format: csv
    recipe:
      command: python make.py output2 '{output}'
  switch1:
    switch: decision3
    cases: {a: output1, b: output2}
  result:
    type: metric
    format: json
    inputs: [switch1]
    recipe:
      command: python make.py '{inputs.switch1}' '{output}'
universes:
  u1:
    decisions: {decision3: a, decision1: b, decision2: b}
  u2:
    derived_from: u1
    decisions: {decision3: b, decision2: a}
