spec_version: "0.1.0"
decisions:
  decision1:
    options: {a: {}, b: {}}
outputs:
  output1:
    type: data
    format: csv
    recipe:
      command: python make.py output1 '{output}'
  switch1:
    switch: decision1
    cases: {b: output1}
  switch2:
    switch: decision1
    cases:
      a: switch1#u1
      b: output1
  result:
    type: metric
    format: json
    inputs: [switch2]
    recipe:
      command: python make.py '{inputs.switch2}' '{output}'
universes:
  u1:
    decisions: {decision1: a}
  u2:
    decisions: {decision1: b}
