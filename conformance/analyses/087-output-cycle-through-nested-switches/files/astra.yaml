spec_version: "0.1.0"
decisions:
  decision1:
    options: {a: {}, b: {}}
  decision2:
    options: {x: {}, y: {}}
outputs:
  output1:
    type: data
    format: csv
    recipe:
      command: python make.py output1 '{output}'
  switch1:
    switch: decision1
    cases: {a: output1, b: switch2}
  switch2:
    switch: decision2
    cases: {x: switch1, y: output1}
  result:
    type: metric
    format: json
    inputs: [switch1]
    recipe:
      command: python make.py '{inputs.switch1}' '{output}'
universes:
  u1:
    decisions: {decision1: a}
