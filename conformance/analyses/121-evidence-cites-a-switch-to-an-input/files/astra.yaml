spec_version: "0.1.0"
inputs:
  input1:
    path: data/input1.csv
decisions:
  decision1:
    options: {a: {}, b: {}}
outputs:
  output1:
    type: data
    format: csv
    recipe:
      command: python make.py output1 '{output}'
  switch1:
    switch: decision1
    cases: {a: input1, b: output1}
  result:
    type: metric
    format: json
    inputs: [switch1]
    recipe:
      command: python make.py '{inputs.switch1}' '{output}'
universes:
  u1:
    decisions: {decision1: b}
findings:
  finding1:
    claim: The output is reproducible.
    evidence:
      - artifact: switch1
