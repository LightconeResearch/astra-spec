spec_version: "0.1.0"
decisions:
  decision1:
    options: {a: {}, b: {}}
outputs:
  output1:
    type: data
    format: csv
    recipe:
      command: python make.py output1 '{output}'
  output2:
    type: data
    format: csv
    recipe:
      command: python make.py output2 '{output}'
  switch1:
    switch: decision1
    cases: {aa: output1, b: output2}
  output3:
    type: table
    format: csv
    inputs: [switch1#u1]
    recipe:
      command: python make.py '{inputs.switch1#u1}' '{output}'
universes:
  u1:
    decisions: {decision1: a}
