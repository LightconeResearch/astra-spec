spec_version: "0.1.0"
decisions:
  decision1:
    options: {a: {}, b: {}}
outputs:
  output1:
    type: data
    format: csv
    recipe:
      command: python make.py output1 '{output}'
  switch1:
    switch: decision1
    cases: {b: output1}
  output4:
    type: figure
    format: png
    inputs: [switch1]
    recipe:
      command: python make.py '{inputs.switch1}' '{output}'
  output2:
    type: table
    format: csv
    inputs: [output4#u1]
    recipe:
      command: python make.py '{inputs.output4#u1}' '{output}'
universes:
  u1:
    decisions: {decision1: a}
