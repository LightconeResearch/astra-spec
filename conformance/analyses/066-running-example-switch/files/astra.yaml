spec_version: "0.1.0"
analyses:
  stage:
    path: stage
inputs:
  input1:
    path: data/input1.csv
decisions:
  decision1:
    options:
      a: {}
      b: {}
      c:
        excluded: It needs data this analysis doesn't have.
  decision3:
    options: {a: {}, b: {}}
outputs:
  output1:
    type: metric
    format: json
    inputs: [input1, stage.output3]
    decisions: [decision1, stage.decision2]
    recipe:
      command: >-
        python src/output1.py {inputs} '{decisions.decision1}'
        '{decisions.stage.decision2}' '{output}'
  output2:
    type: table
    format: csv
    inputs: [output1#u1, output1#u2, stage.output3#v1]
    recipe:
      command: python src/output2.py {inputs} '{output}'
  switch1:
    switch: decision1
    cases:
      b: stage.output3
  output6:
    type: figure
    format: png
    inputs: [switch1]
    decisions: [decision3]
    recipe:
      command: >-
        python src/output6.py '{inputs.switch1}' '{decisions.decision3}'
        '{output}'
universes:
  u1:
    decisions:
      decision1: b
      decision3: a
      stage.decision2: b
  u2:
    derived_from: u1
    decisions: {decision1: a}
