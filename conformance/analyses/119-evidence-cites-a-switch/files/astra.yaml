spec_version: "0.1.0"
decisions:
  decision1:
    options: {a: {}, b: {}}
  decision2:
    options: {x: {}, y: {}}
outputs:
  output1:
    type: data
    format: csv
    recipe:
      command: python make.py output1 '{output}'
  output2:
    type: data
    format: csv
    decisions: [decision2]
    recipe:
      command: python make.py '{decisions.decision2}' '{output}'
  switch2:
    switch: decision2
    cases: {x: output1, y: output2}
  switch1:
    switch: decision1
    cases: {a: output1, b: switch2}
universes:
  u1:
    decisions: {decision1: a}
  u2:
    decisions: {decision1: b, decision2: y}
findings:
  finding1:
    claim: The two branches agree.
    evidence:
      - artifact: switch1
