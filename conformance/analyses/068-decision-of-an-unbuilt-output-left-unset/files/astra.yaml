spec_version: "0.1.0"
decisions:
  decision1:
    options: {a: {}, b: {}}
  decision3:
    options: {a: {}, b: {}}
outputs:
  output1:
    type: data
    format: csv
    recipe:
      command: python make.py output1 '{output}'
  switch1:
    switch: decision1
    cases: {b: output1}
  output6:
    type: figure
    format: png
    inputs: [switch1]
    decisions: [decision3]
    recipe:
      command: >-
        python make.py '{inputs.switch1}' '{decisions.decision3}' '{output}'
universes:
  u1:
    decisions: {decision1: b, decision3: a}
  u2:
    decisions: {decision1: a}
