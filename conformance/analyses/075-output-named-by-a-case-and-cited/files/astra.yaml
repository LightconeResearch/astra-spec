spec_version: "0.1.0"
decisions:
  decision1:
    options: {a: {}, b: {}}
  decision2:
    options: {x: {}, y: {}}
outputs:
  output1:
    type: data
    format: csv
    decisions: [decision2]
    recipe:
      command: python make.py '{decisions.decision2}' '{output}'
  output2:
    type: data
    format: csv
    recipe:
      command: python make.py output2 '{output}'
  switch1:
    switch: decision1
    cases: {a: output1, b: output2}
  result:
    type: metric
    format: json
    inputs: [switch1]
    recipe:
      command: python make.py '{inputs.switch1}' '{output}'
universes:
  u1:
    decisions: {decision1: a, decision2: x}
  u2:
    decisions: {decision1: b}
findings:
  finding1:
    claim: Output1 shows the effect.
    evidence:
      - artifact: output1
