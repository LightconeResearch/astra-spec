spec_version: "0.1.0"
decisions:
  decision1:
    options: {a: {}, b: {}}
  decision2:
    options: {x: {}, y: {}}
outputs:
  output1:
    type: data
    format: csv
    recipe:
      command: python make.py output1 '{output}'
  output2:
    type: data
    format: csv
    recipe:
      command: python make.py output2 '{output}'
  output3:
    type: data
    format: csv
    recipe:
      command: python make.py output3 '{output}'
  switch2:
    switch: decision2
    cases: {x: output2, y: output3}
  switch1:
    switch: decision1
    cases: {a: output1, b: switch2}
  result:
    type: metric
    format: json
    inputs: [switch1]
    recipe:
      command: python make.py '{inputs.switch1}' '{output}'
universes:
  u1:
    decisions: {decision1: a}
  u2:
    decisions: {decision1: b}
