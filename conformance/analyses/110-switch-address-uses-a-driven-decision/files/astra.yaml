spec_version: "0.1.0"
analyses:
  stage:
    path: stage
inputs:
  input1:
    path: data/input1.csv
outputs:
  output1:
    type: data
    format: csv
    recipe:
      command: python make.py output1 '{output}'
  switch1:
    switch: stage.decision2
    cases: {a: input1, b: output1}
  result:
    type: metric
    format: json
    inputs: [switch1]
    recipe:
      command: python make.py '{inputs.switch1}' '{output}'
universes:
  u1:
    decisions: {stage.decision2: a}
  u2:
    decisions: {stage.decision2: b}
