spec_version: "0.1.0"
analyses:
  other:
    path: ../other
inputs:
  input1:
    path: data/input1.csv
decisions:
  mode:
    options:
      fast: {}
      slow:
        requires: [other.decision1.a]
outputs:
  output3:
    type: data
    format: csv
    inputs: [input1]
    recipe:
      command: python make.py '{inputs.input1}' '{output}'
  output4:
    type: metric
    format: json
    decisions: [mode]
    recipe:
      command: python make.py '{decisions.mode}' '{output}'
universes:
  main:
    decisions: {mode: fast}
