spec_version: "0.1.0"
decisions:
  decision1:
    options: {a: {}, b: {}}
  decision2:
    options: {a: {}, b: {}}
outputs:
  output1:
    type: data
    format: csv
    recipe:
      command: python make.py output1 '{output}'
  output2:
    type: data
    format: csv
    recipe:
      command: python make.py output2 '{output}'
  switch1:
    switch: decision1
    cases: {a: output1, b: output2}
  output4:
    type: table
    format: csv
    inputs: [switch1#u1]
    recipe:
      command: python make.py '{inputs.switch1#u1}' '{output}'
  output3:
    type: metric
    format: json
    decisions: [decision2]
    recipe:
      command: python make.py '{decisions.decision2}' '{output}'
universes:
  u1:
    decisions: {decision1: a, decision2: a}
  u2:
    decisions: {decision2: b}
findings:
  finding1:
    claim: Option a gives output1.
    evidence:
      - artifact: switch1
