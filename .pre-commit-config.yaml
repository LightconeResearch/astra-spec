---
# https://pre-commit.com/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        # What this hook's loader refuses is the point of these fixtures:
        # each fails at parse (a duplicate key, malformed YAML, a local tag, a
        # second document, bytes that aren't UTF-8 or a C1 control). Keep in
        # step with .yamllint.yaml.
        exclude: ^tests/data/invalid/Analysis-(101-duplicate-output|146-duplicate-universe|182-malformed-yaml|201-local-tag|204-second-document|211-not-utf-8|212-c1-control-in-plain-scalar)\.yaml$
      # Generated files are checked against a fresh generation instead
      # (`just check-generated`), so these hooks leave them as they are.
      - id: end-of-file-fixer
        exclude: ^src/astra/schema/generated/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^src/astra/schema/generated/

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/crate-ci/typos
    rev: v1.31.1
    hooks:
      - id: typos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.6.12
    hooks:
      - id: uv-lock
