---
# https://pre-commit.com/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        # A duplicate key is this fixture's point: it fails at parse.
        exclude: ^tests/data/invalid/Analysis-101-duplicate-output\.yaml$
      # Generated files are checked against a fresh generation instead
      # (`just check-generated`), so these hooks leave them as generated.
      - id: end-of-file-fixer
        exclude: ^src/astra/schema/generated/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^src/astra/schema/generated/

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/crate-ci/typos
    rev: v1.31.1
    hooks:
      - id: typos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.6.12
    hooks:
      - id: uv-lock
