---
# https://pre-commit.com/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        # Failing at parse (a duplicate key, malformed YAML, a %YAML 1.1
        # directive, a local tag, a second document) is the point of these
        # fixtures and of the yaml-test-suite error cases. Keep in step with
        # .yamllint.yaml.
        exclude: ^tests/(data/invalid/Analysis-(101-duplicate-output|146-duplicate-universe|182-malformed-yaml|183-yaml-1-1-directive|192-comment-glued-to-a-scalar|193-flow-line-not-indented|194-escape-beyond-unicode|201-local-tag|204-second-document)\.yaml|yaml-test-suite/.*)$
      # Generated files are checked against a fresh generation instead
      # (`just check-generated`), and the yaml-test-suite error cases are kept
      # byte for byte as vendored, so these hooks leave them as they are.
      - id: end-of-file-fixer
        exclude: ^(src/astra/schema/generated|tests/yaml-test-suite)/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(src/astra/schema/generated|tests/yaml-test-suite)/

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/crate-ci/typos
    rev: v1.31.1
    hooks:
      - id: typos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.6.12
    hooks:
      - id: uv-lock
