[project]

site_name = "ASTRA"
site_description = "ASTRA — Agentic Schema for Transparent Research Analysis."
site_author = "Lightcone Research"
site_url = "https://astra-spec.org/"
copyright = "&copy; 2026 ASTRA Contributors"

repo_url = "https://github.com/astra-project/astra-spec"
repo_name = "astra-project/astra-spec"

# The ASTRA brand (https://github.com/astra-project/brand): its logo, colours
# and fonts are in docs/assets/, and the theme in docs/stylesheets/astra.css.
extra_css = ["stylesheets/astra.css"]

nav = [
  { "Documentation" = [
      { "Home" = "index.md" },
      { "Installation" = "installation.md" },
      { "Getting started" = "getting-started.md" },
      { "CLI reference" = "cli.md" },
      { "About" = "about.md" },
  ] },
  { "Specification" = [
      { "Format reference" = "specification.md" },
      { "Field reference" = "elements/index.md" },
  ] },
  { "Community" = [
      { "Overview" = "community.md" },
      { "RFC process" = "rfc-process.md" },
      { "Governance" = "governance.md" },
  ] },
]

# Versioning is handled by mike (https://github.com/squidfunk/mike).
# Each version of the site is deployed as a subdirectory under site_url
# (e.g. /0.0.9/, /latest/). The picker is rendered natively in the header.
[project.extra.version]
provider = "mike"

[project.theme]

variant = "modern"
custom_dir = "overrides"
favicon = "assets/favicon.svg"
logo = "assets/brand/astra-compact.svg"
# The brand's fonts are bundled (astra.css); don't load the theme's default.
font = false

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
]

# Light/dark palettes with a manual toggle.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
