{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link rel="icon" href="{{ 'assets/favicon.ico' | url }}" sizes="48x48">
  <link rel="apple-touch-icon" href="{{ 'assets/apple-touch-icon.png' | url }}">
  <meta name="theme-color" content="#F8F7F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#221F20" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{% if page and page.title and not page.is_homepage %}{{ page.title | striptags }} - {% endif %}{{ config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:image" content="https://astra-spec.org/latest/assets/brand/astra-social-card-1280x640.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">
{% endblock %}
