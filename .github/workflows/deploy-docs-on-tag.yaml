---
name: Deploy versioned docs on tag

on:  # yamllint disable-line rule:truthy
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (without leading v), e.g. 0.1.0 or 0.1.0rc1"
        required: true
      tools_ref:
        description: "astra-tools tag or branch whose CLI reference and installation page to show (default: the justfile's tools_ref at the version's tag)"
        required: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    # After an astra-tools release, a dispatch with the current version and
    # the new tools_ref deploys that version again with astra-tools' new pages,
    # and the specification needs no new tag. Empty on a tag push, where the
    # justfile's tools_ref holds.
    env:
      ASTRA_TOOLS_REF: ${{ inputs.tools_ref }}

    strategy:
      matrix:
        pyversion: ["3.13"]

    permissions:
      contents: write  # to let mike push to gh-pages

    steps:
      # https://github.com/actions/checkout
      # A dispatch checks out the tag of its version, not the ref picked in
      # the Actions UI: the site publishes the checkout's committed contract,
      # and only the tagged commit holds the release's (main holds `dev`).
      # `just docs-deploy` refuses anywhere else.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}
          fetch-depth: 0  # mike needs full history to update gh-pages

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.pyversion }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.pyversion }}

      - name: Install just
        run: uv tool install rust-just

      - name: Install dependencies
        run: uv sync --group dev --group docs --no-progress

      # mike builds without --strict: build strict first, so a warning stops
      # the deploy.
      - name: Build documentation in strict mode
        run: just docs-strict

      - name: Configure git for the bot
        run: |
          git config user.name  github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      # A release X.Y.Z deploys at /X.Y.Z/ and moves the aliases X.Y and
      # latest: X.Y serves the latest patch's schema/ files, which is where
      # https://w3id.org/astra/X.Y/ redirects. A pre-release (X.Y.Z followed
      # by aN, bN or rcN) deploys at its own version and moves none.
      - name: Resolve version and aliases
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ "${VERSION}" =~ ^([0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
            ALIASES="${BASH_REMATCH[1]} latest"
          elif [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            ALIASES=""
          else
            echo "::error::not a release or a pre-release version: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "aliases=${ALIASES}" >> "$GITHUB_OUTPUT"

      - name: Deploy versioned docs to gh-pages
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ALIASES: ${{ steps.version.outputs.aliases }}
        # ALIASES is left unquoted so that each alias is its own argument.
        run: just docs-deploy "${RELEASE_VERSION}" ${ALIASES}
