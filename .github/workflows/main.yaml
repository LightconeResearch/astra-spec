# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

env:
  FORCE_COLOR: "1" # Make tools pretty.

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `just test` checks the generated files, so `_stage-versioned`
          # needs the tag at HEAD, if there is one, to inject the version
          # they were generated with (`dev` otherwise).
          fetch-depth: 0
          fetch-tags: true

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install project
        run: uv sync --dev

      - name: Run test suite
        run: just test

      # https://github.com/actions/setup-node
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      # The contract compiles under Ajv's `strict: true`, as spec §10 says
      # strict validators compile it.
      - name: Compile the JSON Schemas with Ajv in strict mode
        run: just check-ajv
