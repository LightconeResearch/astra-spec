# The option `rf` cites the prior insight `forests_resist_noise`, and the
# finding pins its evidence to the universe `u1`, since `result` is built per
# universe.
spec_version: "0.1.0"
outputs:
  result:
    type: metric
    format: json
    decisions: [model]
decisions:
  model:
    options:
      rf:
        insights: [forests_resist_noise]
      svm: {}
universes:
  u1:
    decisions:
      model: rf
prior_insights:
  forests_resist_noise:
    claim: Random forests stay accurate as label noise grows.
    evidence:
      - doi: 10.5555/12345678
        version: 2
        quote:
          prefix: "In every experiment, "
          exact: "the forest lost less than one point of accuracy"
          suffix: " at 20% label noise."
        location: {value: "page=6"}
findings:
  rf_accuracy:
    label: Forest accuracy
    claim: The random forest reaches 0.93 accuracy.
    description: Measured on the held-out tenth of the catalogue.
    scope: Tabular data with fewer than 10 000 rows.
    tags: [accuracy, random-forest]
    evidence:
      - artifact: "result#u1"
