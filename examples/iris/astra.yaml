spec_version: "0.1.0"
label: Iris Classification Study
description: |
  A demonstration analysis that builds a classifier for the classic
  Iris dataset, exploring different preprocessing and model choices.
  Feature scaling and model choice are the main levers; the analysis
  emits a trained classifier, accuracy/F1 metrics, a confusion matrix,
  a model-comparison table, and a final conclusion report.
tags:
  - classification
  - sklearn
  - example

outputs:
  iris_data:
    type: data
    format: csv
    description: >-
      Fisher's classic 150-sample, 3-class dataset, loaded from
      sklearn.datasets.load_iris
    recipe:
      command: python src/load.py --out {output}

  trained_output:
    type: data
    format: pkl
    description: The classifier trained in each universe
    inputs: [iris_data]
    decisions: [scaling, model, test_size, random_seed]
    recipe:
      command: >-
        python src/train.py --data {inputs.iris_data}
        --scaling {decisions.scaling} --model {decisions.model}
        --test-size {decisions.test_size} --seed {decisions.random_seed}
        --out {output}

  accuracy:
    type: metric
    format: json
    description: Classification accuracy on held-out test set
    inputs: [trained_output]
    recipe:
      command: >-
        python src/evaluate.py --model {inputs.trained_output}
        --metric accuracy --out {output}

  f1_score:
    type: metric
    format: json
    description: Macro-averaged F1 score
    inputs: [trained_output]
    recipe:
      command: >-
        python src/evaluate.py --model {inputs.trained_output}
        --metric f1 --out {output}

  confusion_matrix:
    type: figure
    format: png
    description: Confusion matrix heatmap
    inputs: [trained_output]
    recipe:
      command: >-
        python src/evaluate.py --model {inputs.trained_output}
        --metric confusion_matrix --out {output}

  model_comparison:
    type: table
    format: csv
    description: >-
      Accuracy of the baseline (random forest) against svm_focused (SVM)
    inputs:
      - accuracy#baseline
      - accuracy#svm_focused
    recipe:
      command: >-
        python src/compare.py --a {inputs.accuracy#baseline}
        --b {inputs.accuracy#svm_focused} --out {output}

  conclusion:
    type: report
    format: md
    description: >-
      Summary of classifier performance and suitability for the
      application
    inputs: [trained_output]
    recipe:
      command: >-
        python src/evaluate.py --model {inputs.trained_output}
        --report --out {output}

decisions:
  scaling:
    label: Feature Scaling
    rationale: Scaling affects distance-based algorithms like SVM
    options:
      none:
        label: No Scaling
        description: Use raw feature values
      standard:
        label: StandardScaler
        description: Z-score normalization (mean=0, std=1)
      minmax:
        label: MinMaxScaler
        description: Scale to [0, 1] range
        incompatible_with:
          - model.svm

  model:
    label: Classification Model
    rationale: Core algorithmic choice affecting accuracy and interpretability
    options:
      svm:
        label: Support Vector Machine
        description: Maximum margin classifier
        requires:
          - scaling.standard
      random_forest:
        label: Random Forest
        description: Ensemble of decision trees
      logistic:
        label: Logistic Regression
        description: Linear classifier with probabilistic output

  test_size:
    label: Test Set Proportion
    rationale: Trade-off between training data and evaluation reliability
    options:
      small:
        label: "20%"
      medium:
        label: "30%"

  random_seed:
    label: Random Seed
    rationale: For reproducibility and stability testing
    options:
      seed_42:
        label: "42"
      seed_123:
        label: "123"

universes:
  baseline:
    description: >-
      A random forest with standard scaling, a 20% test set and seed 42
    decisions:
      scaling: standard
      model: random_forest
      test_size: small
      random_seed: seed_42

  svm_focused:
    description: >-
      The baseline with the model switched to an SVM, which requires the
      standard scaling it inherits
    derived_from: baseline
    decisions:
      model: svm
