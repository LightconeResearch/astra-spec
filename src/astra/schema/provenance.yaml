---
id: https://w3id.org/astra/provenance
name: provenance
description: |-
  The provenance record: what a runner writes for each result it makes,
  saying what the result is and the run of the recipe that made it. Through
  this schema a record maps onto W3C PROV-O.
# Placeholder version. The real version is injected at build time from the
# latest git tag (or RELEASE_VERSION) — see `_stage-versioned` in the justfile.
version: 0.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  astra: https://w3id.org/astra/
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
  schema: http://schema.org/

default_prefix: astra
default_range: string

imports:
  - linkml:types
  - types

classes:

  ProvenanceRecord:
    tree_root: true
    class_uri: prov:Entity
    description: >-
      The provenance of one result, which the runner that made it writes as
      JSON: what the result is and the run of the recipe that made it.
    attributes:
      spec_version:
        range: spec_version
        required: true
        description: >-
          The version of the ASTRA specification the record follows, such as
          `0.1.0`.
      address:
        range: reference
        required: true
        description: >-
          The result as the analysis it belongs to addresses it: the output's
          id, after the ids of the declared analyses that lead to it, then `#`
          and the universe's id when the result is built in a universe, such
          as `subanalysis1.output1#u1`.
      content_hash:
        range: content_hash
        required: true
        description: The SHA-256 digest of the result's bytes.
      size:
        range: integer
        minimum_value: 0
        required: true
        description: The size of the result, in bytes.
      generated_by:
        range: Generation
        inlined: true
        required: true
        slot_uri: prov:wasGeneratedBy
        description: The run of the recipe that made the result.

  Generation:
    class_uri: prov:Activity
    description: >-
      A run of an output's recipe: the commit it ran from, what it read, the
      environment it ran in and the runner that ran it.
    attributes:
      commit:
        range: commit_id
        required: true
        description: >-
          The full id of the git commit the recipe ran from. It pins every file
          of the code and every `astra.yaml`, an analysis in a submodule
          through the commit the submodule is pinned at.
      inputs:
        range: RecordedInput
        multivalued: true
        inlined_as_list: true
        slot_uri: prov:used
        description: >-
          What the recipe read: one item for each entry the output's `inputs`
          lists, matched by `entry`; the order of the items carries no
          meaning.
      environment:
        range: Environment
        inlined: true
        required: true
        slot_uri: prov:used
        description: The environment the recipe ran in.
      runner:
        range: Runner
        inlined: true
        required: true
        slot_uri: prov:wasAssociatedWith
        description: The runner that ran the recipe.
      started:
        range: timestamp
        slot_uri: prov:startedAtTime
        description: >-
          When the recipe started, in UTC to the millisecond, such as
          `2026-10-26T14:00:00.000Z`.
      finished:
        range: timestamp
        slot_uri: prov:endedAtTime
        description: >-
          When the recipe finished, in UTC to the millisecond, such as
          `2026-10-26T14:00:02.000Z`.

  RecordedInput:
    class_uri: prov:Entity
    description: >-
      One of the output's inputs, as the recipe read it: the entry, and the
      content hash and size of what the recipe read through it.
    attributes:
      entry:
        range: reference
        required: true
        description: >-
          The entry exactly as the output's `inputs` lists it in the
          `astra.yaml`, such as `iris.data`.
      content_hash:
        range: content_hash
        required: true
        description: >-
          The SHA-256 digest of what the recipe read through the entry: another
          output's result, or the file an input names.
      size:
        range: integer
        minimum_value: 0
        required: true
        description: >-
          The size of what the recipe read through the entry, in bytes.

  Environment:
    class_uri: prov:Entity
    description: The environment a recipe ran in, named by an IRI.
    attributes:
      iri:
        identifier: true
        range: uriorcurie
        required: true
        pattern: '^[A-Za-z][A-Za-z0-9+.-]*:[^\x00-\x20\x7f]+$(?!\n)'
        annotations:
          rule: INVALID_VALUE
        description: >-
          An absolute IRI naming exactly that environment, enough for its
          runner, at the version the record gives, to recreate it. It need not
          resolve online: a `urn:` IRI or a scheme of the runner's own will do,
          such as `urn:example-runner:env:sha256:…`.

  Runner:
    class_uri: prov:SoftwareAgent
    description: The software that ran the recipe and wrote the record.
    attributes:
      id:
        required: true
        description: >-
          The runner's name, ideally unique (an IRI, say), such as
          `example-runner`.
      version:
        required: true
        slot_uri: schema:softwareVersion
        description: The runner's version, such as `1.2.0`.
