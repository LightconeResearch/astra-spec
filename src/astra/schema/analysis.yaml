---
id: https://w3id.org/astra/analysis
name: analysis
title: ASTRA
description: |-
  Agentic Schema for Transparent Research Analysis.
  The analysis document, `astra.yaml`: the files an analysis reads, the
  artefacts it makes, and the decisions it makes along the way.
license: https://creativecommons.org/licenses/by/4.0/
# Placeholder version. The real version is injected at build time from the
# latest git tag (or RELEASE_VERSION) — see `_stage-versioned` in the justfile.
version: 0.0.0

prefixes:
  astra: https://w3id.org/astra/
  linkml: https://w3id.org/linkml/

default_prefix: astra
default_range: string

imports:
  - linkml:types
  - types
  - insight

# ==========================================================================
# Enumerations
# ==========================================================================

enums:

  OutputType:
    description: The kind of artefact an output is.
    permissible_values:
      metric:
        description: A metric or measurement.
      figure:
        description: A figure or visualisation.
      table:
        description: A table of data.
      data:
        description: A data file or dataset.
      report:
        description: A report or document.

# ==========================================================================
# Classes
# ==========================================================================

classes:

  # --- Execution ---
  #
  # ASTRA is a specification layer: a recipe describes *what* to run
  # and *what it needs*, not how a runner schedules or instruments it.
  # Field names follow modern container / cluster conventions so the
  # spec reads naturally to anyone familiar with Docker, Kubernetes,
  # Slurm, or batch schedulers.

  Resources:
    description: >-
      Compute resource requirements for a recipe. Values follow
      cloud-native conventions (string-with-units for sized
      quantities) so cluster executors can consume them directly.
    attributes:
      cpus:
        range: float
        minimum_value: 0
        description: >-
          CPU cores requested. Fractional values are allowed
          (e.g., 0.5) for runners that support CPU shares.
      memory:
        description: >-
          Memory requirement as a string with units
          (e.g., '16Gi', '512Mi', '8GB').
      time_limit:
        description: >-
          Maximum wall time as a duration string
          (e.g., '2h', '30m', '1h30m').
      disk:
        description: >-
          Disk requirement as a string with units
          (e.g., '10Gi', '500Mi').
      gpus:
        range: integer
        minimum_value: 1
        description: Number of GPUs

  Recipe:
    description: >-
      A build rule that produces an output. A recipe is pure *how*:
      a `command` to invoke and the execution context
      (`resources`, `container`).

      Recipes do not declare what the output depends on. Provenance
      — upstream inputs, decision-driven parameterization, and
      activation conditions — is declared on the parent Output
      (`inputs`, `decisions`, `when`). Runners surface the resolved
      input map and active decision values to the recipe via
      `{...}` template substitution (see `command`).
    attributes:
      command:
        required: true
        description: >-
          The POSIX shell command that makes the output, such as
          `python src/train.py`. It is a template, whose placeholders a
          runner substitutes before running it:

            {inputs.<entry>}     the path of what an entry of the output's
                                 `inputs` names, with <entry> written
                                 exactly as the entry is, dots and `#`
                                 included, as in
                                 {inputs.classification.accuracy#baseline}
            {decisions.<entry>}  the id of the option selected for the
                                 decision an entry of the output's
                                 `decisions` names, with <entry> written
                                 exactly as the entry is, as in
                                 {decisions.iris.random_seed}
            {inputs}             the paths of all the output's inputs, in
                                 the order of `inputs`, separated by spaces
            {output}             the path the result is written to
            {{ and }}            a literal { and }

          Every placeholder takes one of these forms, and the <entry> of an
          {inputs.<entry>} or {decisions.<entry>} is an entry of the output's
          `inputs` or `decisions`, exactly as written.
      resources:
        range: Resources
        inlined: true
        description: Compute resource requirements (cpus, memory, time_limit, …)
      container:
        description: >-
          Container image name or path to a Containerfile.
          Image names (e.g., 'python:3.9', 'ghcr.io/org/img:latest') are
          pulled as pre-built images; file paths (e.g., 'Containerfile',
          'containers/Dockerfile') are built from source.

  # --- Inputs and outputs ---

  Input:
    description: >-
      A file the analysis reads, tracked in git with it and named by its path.
    attributes:
      id:
        key: true
        range: id
        description: The input's id, written as its key in `inputs`.
      label:
        description: A short display name for the input.
      description:
        description: What the input's data is, in free prose.
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: Keywords for grouping and finding the input.
      path:
        required: true
        pattern: '^(?![/~])(?!(?:[^\x00-\x1f\x7f]*/)?\.\.(?:/|$))(?![^\x00-\x1f\x7f]*/$)[^\x00-\x1f\x7f\\]+$(?!\n)'
        annotations:
          rule: INVALID_PATH
        description: >-
          The path of the input's file, relative to the folder of the
          `astra.yaml`. It is non-empty, doesn't start with `/` or `~`,
          separates folders with `/` (never `\`), has no `..` segment or ASCII
          control character (U+0000–U+001F, U+007F), and doesn't end in `/`.

  Output:
    description: >-
      An artefact the analysis makes, such as a metric, a figure or a table:
      what it is, what it is made from, and how.
    attributes:
      id:
        key: true
        range: id
        description: The output's id, written as its key in `outputs`.
      label:
        description: A short display name for the output.
      description:
        description: What the output is, in free prose.
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: Keywords for grouping and finding the output.
      type:
        range: OutputType
        required: true
        description: The kind of artefact the output is.
      format:
        required: true
        pattern: '^[a-z0-9][a-z0-9_.+-]*$(?!\n)'
        annotations:
          rule: INVALID_VALUE
        description: >-
          How the output's artefact is encoded, as a lowercase token: the
          extension of its results' files, without the leading dot, such as
          `png`, `csv` or `parquet`. Any token that matches the pattern is a
          format.
      inputs:
        multivalued: true
        range: reference
        minimum_cardinality: 1
        description: >-
          What the output is made from, in order: references to inputs and
          outputs of the analysis or of analyses it declares. A reference can
          be pinned to a universe with `#`.
      decisions:
        multivalued: true
        range: address
        minimum_cardinality: 1
        description: >-
          The addresses of the decisions whose option the output is made with
          directly, not through what it reads: a different option for any of
          them, in the universe being built, can give a different result.
      when:
        multivalued: true
        range: condition
        minimum_cardinality: 1
        description: >-
          The conditions under which the output is active. It is active only
          when every condition holds.
      recipe:
        range: Recipe
        required: true
        inlined: true
        description: How the output is made.

  # --- Decisions ---

  Decision:
    description: >-
      A choice the analysis makes between options, such as which estimator
      to use.
    attributes:
      id:
        key: true
        range: id
        description: The decision's id, written as its key in `decisions`.
      label:
        description: A short display name for the decision.
      rationale:
        description: Why the analysis makes this decision, in free prose.
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: Keywords for grouping and finding the decision.
      when:
        multivalued: true
        range: condition
        minimum_cardinality: 1
        description: >-
          The conditions under which the decision is active. It is active only
          when every condition holds.
      options:
        range: Option
        multivalued: true
        inlined: true
        required: true
        minimum_cardinality: 1
        description: >-
          The options the decision chooses between, keyed by id. There is at
          least one.

  Option:
    description: One of the options a decision chooses between.
    attributes:
      id:
        key: true
        range: id
        description: The option's id, written as its key in `options`.
      label:
        description: A short display name for the option.
      description:
        description: What the option is, in free prose.
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: Keywords for grouping and finding the option.
      insights:
        multivalued: true
        range: id
        minimum_cardinality: 1
        description: The ids of the prior insights that support the option.
      requires:
        multivalued: true
        range: option_reference
        minimum_cardinality: 1
        description: >-
          The options that are also selected whenever this option is.
      incompatible_with:
        multivalued: true
        range: option_reference
        minimum_cardinality: 1
        description: >-
          The options that are never selected together with this option.
      excluded:
        pattern: '[^\x00-\x20\x7f]'
        annotations:
          rule: BLANK_EXCLUDED
        description: >-
          Why the option is ruled out, as a reason that is not blank; any
          string is a reason, `no` and `off` included. An option with a reason
          is excluded: no universe selects it.

  # --- Universes ---

  Universe:
    description: >-
      An entry of `universes`: a universe of the analysis, a selection of one
      option for every active decision of the analysis and of every analysis
      reached through a declaration that the analysis's universes drive, or
      an import, which has an `analysis` and a `universe`, names one of
      another analysis's universes and selects nothing. A universe's
      effective selection is the effective selection of the universe it is
      derived from, if any, with its own `decisions` written over it decision
      by decision and every inherited selection of a decision that isn't
      active in the result dropped, so a universe that switches a decision on
      must set it.
    attributes:
      id:
        key: true
        range: id
        description: >-
          The entry's id, written as its key in `universes`: for an import,
          the id the analysis gives the universe it imports.
      label:
        description: >-
          A short display name for the universe. It is not inherited through
          `derived_from`.
      description:
        description: What the universe is, in free prose.
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: >-
          Keywords for grouping and finding the universe. They are not
          inherited through `derived_from`.
      derived_from:
        range: id
        description: >-
          The id of another universe of the analysis, never an import, whose
          effective selection this universe's effective selection is built
          on, so that this universe gives only the decisions it changes.
      decisions:
        range: DecisionSelection
        multivalued: true
        inlined: true
        description: >-
          The options the universe selects, as `<decision>: <option>`, one
          key per decision. Each key is the id of a decision of the analysis
          or, for a decision of another analysis, a flat key: the decision's
          address through the declarations, `<declaration>.<decision>`, such
          as `stage.method`, or another spelling of that address, through no
          declaration back to an analysis already on its chain.
      analysis:
        range: address
        description: >-
          For an import, the address of the declaration that leads to the
          analysis whose universe it imports, through as many declarations as
          lead to it, such as `catalog` or `stage.inner`.
      universe:
        range: id
        description: >-
          For an import, the id of the universe it imports: a universe of the
          analysis that `analysis` leads to, never an import of that analysis.
    rules:
      - description: An import has a `universe`.
        annotations:
          rule: INVALID_IMPORT
        preconditions:
          slot_conditions:
            analysis:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            universe:
              value_presence: PRESENT
      # Each absent field has a rule of its own: LinkML writes two absent
      # fields in one postcondition as "not both".
      - description: An import has no `decisions`.
        annotations:
          rule: INVALID_IMPORT
        preconditions:
          slot_conditions:
            analysis:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            decisions:
              value_presence: ABSENT
      - description: An import has no `derived_from`.
        annotations:
          rule: INVALID_IMPORT
        preconditions:
          slot_conditions:
            analysis:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            derived_from:
              value_presence: ABSENT
      - description: An entry with a `universe` has an `analysis`.
        annotations:
          rule: INVALID_IMPORT
        preconditions:
          slot_conditions:
            universe:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            analysis:
              value_presence: PRESENT

  DecisionSelection:
    description: >-
      The option a universe selects for one decision, written in the
      universe's `decisions` as `<decision>: <option>`, such as `model: svm`.
    attributes:
      decision:
        key: true
        range: address
        # A map key that doesn't match its key's type is a bad id, whatever
        # that type (§9), so this names its code over `address`'s.
        annotations:
          rule: INVALID_ID
        description: >-
          The address of the decision, written as its key in the universe's
          `decisions`.
      option:
        range: id
        required: true
        description: The id of the option selected for the decision.

  # --- Declarations ---

  AnalysisDeclaration:
    description: >-
      An analysis that this analysis uses, found by exactly one of `path`
      and `url`. Its elements are addressed through the declaration's id, as
      `<declaration>.<element>`.
    attributes:
      id:
        key: true
        range: id
        description: >-
          The id this analysis addresses the declared analysis by, written as
          its key in `analyses`.
      path:
        pattern: '^(?![/~])[^\x00-\x1f\x7f\\]+$(?!\n)'
        annotations:
          rule: INVALID_PATH
        description: >-
          The directory of the declared analysis's `astra.yaml`, relative to
          the folder of this `astra.yaml` and inside the repository this
          file is read from, which in the working tree is the root's,
          submodules included. It is non-empty, doesn't start with `/` or `~`,
          separates folders with `/` (never `\`), and has no ASCII control
          character (U+0000–U+001F, U+007F); `..` segments are allowed.
      url:
        pattern: '^(?:[A-Za-z][A-Za-z0-9+.-]*://[^\x00-\x20\x7f]+|(?![A-Za-z][A-Za-z0-9+.-]*://)(?:[^\x00-\x20\x7f/@:]+@)?[^\x00-\x20\x7f/@:]+:[^\x00-\x20\x7f]+)$(?!\n)'
        annotations:
          rule: INVALID_VALUE
        description: >-
          Where git fetches another repository from, as a remote with no ASCII
          space or control character: `scheme://…`, such as
          `https://github.com/owner/analysis` or `file:///srv/repo`, or
          `[user@]host:path`, such as `git@github.com:owner/repo`. The declared
          analysis is the one at the top level of that repository, at
          `commit`.
      commit:
        range: commit_id
        description: >-
          The full id of the commit the declared analysis is read at. A
          declaration with a `url` has one; with a `path`, it declares the
          analysis at that path as it was at that commit.
    # LinkML can't annotate the exactly_one_of list itself, so each branch
    # names the code, the same one.
    exactly_one_of:
      - slot_conditions:
          path:
            required: true
        annotations:
          rule: INVALID_DECLARATION_SOURCE
      - slot_conditions:
          url:
            required: true
        annotations:
          rule: INVALID_DECLARATION_SOURCE
    rules:
      - description: A declaration with a `url` has a `commit`.
        annotations:
          rule: URL_WITHOUT_COMMIT
        preconditions:
          slot_conditions:
            url:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            commit:
              value_presence: PRESENT

  # --- Analysis ---

  Analysis:
    tree_root: true
    description: >-
      An analysis: the files it reads, the artefacts it makes and the
      decisions it makes along the way. It is the content of an
      `astra.yaml` file.
    attributes:
      spec_version:
        range: spec_version
        required: true
        description: >-
          The version of the ASTRA specification the document is written
          against, such as `0.1.0`.
      label:
        description: A short display name for the analysis.
      description:
        description: What the analysis does, in free prose.
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: Keywords for grouping and finding the analysis.
      inputs:
        range: Input
        multivalued: true
        inlined: true
        description: The files the analysis reads, keyed by id.
      outputs:
        range: Output
        multivalued: true
        inlined: true
        required: true
        minimum_cardinality: 1
        description: >-
          The artefacts the analysis makes, keyed by id. There is at least
          one.
      decisions:
        range: Decision
        multivalued: true
        inlined: true
        description: The choices the analysis makes, keyed by id.
      analyses:
        range: AnalysisDeclaration
        multivalued: true
        inlined: true
        description: >-
          The analyses this analysis uses, keyed by the id it addresses them
          by.
      universes:
        range: Universe
        multivalued: true
        inlined: true
        description: >-
          The universes of the analysis, and the universes of other analyses
          it imports, keyed by id. An import has an `analysis` and a
          `universe`.
      prior_insights:
        range: Insight
        multivalued: true
        inlined: true
        description: >-
          What earlier work establishes and the analysis builds on, as
          insights keyed by id. Options cite them in their `insights`.
      findings:
        range: Insight
        multivalued: true
        inlined: true
        description: What the analysis concludes, as insights keyed by id.
      container:
        description: >-
          The default container for this analysis's recipes.
          Image names are pulled; file paths are built from source.
