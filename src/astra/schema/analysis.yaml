---
id: https://w3id.org/astra/analysis
name: analysis
title: ASTRA
description: |-
  Agentic Schema for Transparent Research Analysis.
  The analysis document, `astra.yaml`: the files an analysis reads, the
  artefacts it makes, and the decisions it makes along the way.
license: https://creativecommons.org/licenses/by/4.0/
# Placeholder version. The real version is injected at build time from the
# latest git tag (or RELEASE_VERSION) — see `_stage-versioned` in the justfile.
version: 0.0.0

prefixes:
  astra: https://w3id.org/astra/
  linkml: https://w3id.org/linkml/

default_prefix: astra
default_range: string

imports:
  - linkml:types
  - types
  - insight

# ==========================================================================
# Enumerations
# ==========================================================================

enums:

  OutputType:
    description: The kind of artefact an output is.
    permissible_values:
      metric:
        description: A metric or measurement.
      figure:
        description: A figure or visualisation.
      table:
        description: A table of data.
      data:
        description: A data file or dataset.
      report:
        description: A report or document.

# ==========================================================================
# Classes
# ==========================================================================

classes:

  # --- Execution ---

  Resources:
    description: The compute resources a recipe asks for.
    attributes:
      cpus:
        range: float
        minimum_value: 0
        description: >-
          The number of CPU cores the recipe asks for, which may be
          fractional, such as 0.5.
      memory:
        description: >-
          The memory the recipe asks for, as free text, such as `4GB`.
      time_limit:
        description: >-
          The longest the recipe may run, as free text, such as `2h`.
      disk:
        description: >-
          The disk space the recipe asks for, as free text, such as `10GB`.
      gpus:
        range: integer
        minimum_value: 1
        description: The number of GPUs the recipe asks for.

  Recipe:
    description: >-
      How an output is made: a `command` and the compute `resources` it
      asks for. What the output is made from and the decisions it is made
      with are the output's `inputs` and `decisions`; the command reaches
      the inputs and decisions through its placeholders.
    attributes:
      command:
        required: true
        description: >-
          The POSIX shell command that makes the output, such as
          `python src/output1.py`. It is a template. Read from the left, `{{`
          stands for a literal `{` and `}}` for a literal `}`, and any other
          `{` opens a placeholder, which ends at the next `}`. A runner
          substitutes each placeholder, and each `{{` and `}}`, before running
          the command:

            {inputs.<entry>}     the path of what an entry of the output's
                                 `inputs` names (for a switch, what the case
                                 it takes names), with <entry> written
                                 exactly as the entry is, dots and `#`
                                 included, as in
                                 {inputs.subanalysis.output1#u1}
            {decisions.<entry>}  the id of the option selected for the
                                 decision an entry of the output's
                                 `decisions` names, with <entry> written
                                 exactly as the entry is, as in
                                 {decisions.subanalysis.decision1}
            {inputs}             the paths of all the output's inputs, in
                                 the order of `inputs`, separated by spaces
            {output}             the path the result is written to

          Every brace belongs to a `{{`, a `}}` or a placeholder, every
          placeholder takes one of these forms, and the <entry> of an
          {inputs.<entry>} or {decisions.<entry>} is an entry of the output's
          `inputs` or `decisions`, exactly as written.
      resources:
        range: Resources
        inlined: true
        description: The compute resources the recipe asks for.

  # --- Inputs and outputs ---

  Input:
    description: >-
      A file the analysis reads, tracked in git with it and named by its path.
    attributes:
      id:
        key: true
        range: id
        description: The input's id, written as its key in `inputs`.
      label:
        description: A short display name for the input.
      description:
        description: What the input's data is, in free prose.
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: Keywords for grouping and finding the input.
      path:
        required: true
        pattern: '^[^/]'
        annotations:
          rule: INVALID_PATH
        description: >-
          The path of the input's file, relative to the folder of the
          `astra.yaml`, with `/` between folders. It is non-empty and doesn't
          start with `/`.

  Output:
    description: >-
      An entry of `outputs`: an artefact the analysis makes, such as a
      metric, a figure or a table, with what it is, what it is made from and
      how; or a switch, which has a `switch` and `cases`, makes nothing, and
      is read as the case it takes.
    attributes:
      id:
        key: true
        range: id
        description: The output's id, written as its key in `outputs`.
      label:
        description: A short display name for the output.
      description:
        description: What the output is, in free prose.
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: Keywords for grouping and finding the output.
      type:
        range: OutputType
        description: >-
          The kind of artefact the output is. Every output but a switch has
          one.
      format:
        pattern: '^[a-z0-9][a-z0-9_.+-]*$'
        annotations:
          rule: INVALID_VALUE
        description: >-
          How the output's artefact is encoded, as a lowercase token: the
          extension of its results' files, without the leading dot, such as
          `png`, `csv` or `parquet`. Every output but a switch has one.
      inputs:
        multivalued: true
        range: reference
        minimum_cardinality: 1
        description: >-
          What the output is made from, in order: references to inputs and
          outputs of the analysis or of analyses it declares, a switch read
          as the case it takes. A reference can be pinned to a universe with
          `#`.
      decisions:
        multivalued: true
        range: address
        minimum_cardinality: 1
        description: >-
          The addresses of the decisions whose option the output is made with
          directly, not through what it reads: a different option for any of
          them, in the universe being built, can give a different result.
      recipe:
        range: Recipe
        inlined: true
        description: >-
          How the output is made. Every output but a switch has one.
      switch:
        range: address
        description: >-
          For a switch, the address of the decision whose selected option
          picks the case it takes, such as `decision1` or `stage.decision2`.
      cases:
        range: SwitchCase
        multivalued: true
        inlined: true
        minimum_cardinality: 1
        description: >-
          For a switch, what it is read as where its decision selects each
          option that has a case, as `<option>: <reference>`, such as
          `b: stage.output3`. There is at least one, and several options can
          name one reference. Where its decision selects an option with no
          case, the switch isn't built, nor is anything that reads it without
          a pin.
    rules:
      - description: An output that isn't a switch has a `type`, a `format` and a `recipe`.
        annotations:
          rule: MISSING_FIELD
        preconditions:
          slot_conditions:
            switch:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            type:
              value_presence: PRESENT
            format:
              value_presence: PRESENT
            recipe:
              value_presence: PRESENT
      - description: A switch has `cases`.
        annotations:
          rule: INVALID_SWITCH
        preconditions:
          slot_conditions:
            switch:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            cases:
              value_presence: PRESENT
      - description: An entry with `cases` has a `switch`.
        annotations:
          rule: INVALID_SWITCH
        preconditions:
          slot_conditions:
            cases:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            switch:
              value_presence: PRESENT
      # Each absent field has a rule of its own: LinkML writes two absent
      # fields in one postcondition as "not both".
      - description: A switch has no `type`.
        annotations:
          rule: INVALID_SWITCH
        preconditions:
          slot_conditions:
            switch:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            type:
              value_presence: ABSENT
      - description: A switch has no `format`.
        annotations:
          rule: INVALID_SWITCH
        preconditions:
          slot_conditions:
            switch:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            format:
              value_presence: ABSENT
      - description: A switch has no `inputs`.
        annotations:
          rule: INVALID_SWITCH
        preconditions:
          slot_conditions:
            switch:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            inputs:
              value_presence: ABSENT
      - description: A switch has no `decisions`.
        annotations:
          rule: INVALID_SWITCH
        preconditions:
          slot_conditions:
            switch:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            decisions:
              value_presence: ABSENT
      - description: A switch has no `recipe`.
        annotations:
          rule: INVALID_SWITCH
        preconditions:
          slot_conditions:
            switch:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            recipe:
              value_presence: ABSENT

  SwitchCase:
    description: >-
      What a switch is read as where its decision selects one option,
      written in the switch's `cases` as `<option>: <reference>`, such as
      `b: stage.output3`.
    attributes:
      case:
        key: true
        range: id
        description: >-
          The id of an option of the switch's decision, written as its key in
          `cases`.
      target:
        range: reference
        required: true
        description: >-
          A reference to the input, output or switch the switch is read as
          where the option is selected, written as an entry of an output's
          `inputs` is, such as `stage.output3` or `output1#u1`.

  # --- Decisions ---

  Decision:
    description: >-
      A choice the analysis makes between options, such as which method to
      use.
    attributes:
      id:
        key: true
        range: id
        description: The decision's id, written as its key in `decisions`.
      label:
        description: A short display name for the decision.
      rationale:
        description: Why the analysis makes this decision, in free prose.
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: Keywords for grouping and finding the decision.
      options:
        range: Option
        multivalued: true
        inlined: true
        required: true
        minimum_cardinality: 1
        description: >-
          The options the decision chooses between, keyed by id. There is at
          least one.

  Option:
    description: One of the options a decision chooses between.
    attributes:
      id:
        key: true
        range: id
        description: The option's id, written as its key in `options`.
      label:
        description: A short display name for the option.
      description:
        description: What the option is, in free prose.
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: Keywords for grouping and finding the option.
      insights:
        multivalued: true
        range: id
        minimum_cardinality: 1
        description: The ids of the prior insights that support the option.
      requires:
        multivalued: true
        range: option_reference
        minimum_cardinality: 1
        description: >-
          The options that are also selected wherever this option is, among
          the decisions a universe uses: a decision it doesn't use selects
          none.
      incompatible_with:
        multivalued: true
        range: option_reference
        minimum_cardinality: 1
        description: >-
          The options that are never selected together with this option,
          among the decisions a universe uses.
      excluded:
        description: >-
          Why the option is ruled out. An option with a reason is excluded: no
          effective selection selects it.

  # --- Universes ---

  Universe:
    description: >-
      An entry of `universes`: a universe of the analysis, a selection of one
      option for every decision it uses of the analysis and of every
      analysis, declared directly or not, that the analysis's universes
      drive, or an import, which has an `analysis` and a `universe`, names
      one of another analysis's universes and selects nothing. A universe's
      effective selection is the effective selection of the universe it is
      derived from, if any, with its own `decisions` written over it decision
      by decision.
    attributes:
      id:
        key: true
        range: id
        description: >-
          The entry's id, written as its key in `universes`: for an import,
          the id the analysis gives the universe it imports.
      label:
        description: A short display name for the universe.
      description:
        description: What the universe is, in free prose.
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: Keywords for grouping and finding the universe.
      derived_from:
        range: id
        description: >-
          The id of another universe of the analysis, never an import, whose
          effective selection this universe's effective selection is built
          on, so that this universe gives only the decisions it changes. The
          universe inherits only that selection.
      decisions:
        range: DecisionSelection
        multivalued: true
        inlined: true
        description: >-
          The options the universe selects, as `<decision>: <option>`, one
          key per decision. Each key is the id of a decision of the analysis
          or, for a decision of another analysis, a flat key: the decision's
          address through the declarations, `<declaration>.<decision>`, such
          as `subanalysis.decision1`, or another spelling of that address,
          through no declaration back to an analysis already on its chain.
      analysis:
        range: address
        description: >-
          For an import, the address of the declaration that leads to the
          analysis whose universe it imports, through as many declarations as
          lead to it, such as `subanalysis` or `stage.inner`.
      universe:
        range: id
        description: >-
          For an import, the id of the universe it imports: a universe of the
          analysis that `analysis` leads to, never an import of that analysis.
    rules:
      - description: An import has a `universe`.
        annotations:
          rule: INVALID_IMPORT
        preconditions:
          slot_conditions:
            analysis:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            universe:
              value_presence: PRESENT
      # Each absent field has a rule of its own: LinkML writes two absent
      # fields in one postcondition as "not both".
      - description: An import has no `decisions`.
        annotations:
          rule: INVALID_IMPORT
        preconditions:
          slot_conditions:
            analysis:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            decisions:
              value_presence: ABSENT
      - description: An import has no `derived_from`.
        annotations:
          rule: INVALID_IMPORT
        preconditions:
          slot_conditions:
            analysis:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            derived_from:
              value_presence: ABSENT
      - description: An entry with a `universe` has an `analysis`.
        annotations:
          rule: INVALID_IMPORT
        preconditions:
          slot_conditions:
            universe:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            analysis:
              value_presence: PRESENT

  DecisionSelection:
    description: >-
      The option a universe selects for one decision, written in the
      universe's `decisions` as `<decision>: <option>`, such as
      `decision1: a`.
    attributes:
      decision:
        key: true
        range: address
        # A map key that doesn't match its key's type is a bad id, whatever
        # that type (§6), so this names its code over `address`'s.
        annotations:
          rule: INVALID_ID
        description: >-
          The address of the decision, written as its key in the universe's
          `decisions`.
      option:
        range: id
        required: true
        description: The id of the option selected for the decision.

  # --- Declarations ---

  AnalysisDeclaration:
    description: >-
      An analysis that this analysis uses, found by exactly one of `path`
      and `url`. Its elements are addressed through the declaration's id, as
      `<declaration>.<element>`.
    attributes:
      id:
        key: true
        range: id
        description: >-
          The id this analysis addresses the declared analysis by, written as
          its key in `analyses`.
      path:
        pattern: '^[^/]'
        annotations:
          rule: INVALID_PATH
        description: >-
          The directory of the declared analysis's `astra.yaml`, relative to
          the folder of this `astra.yaml`, with `/` between folders. It is
          non-empty and doesn't start with `/`.
      url:
        pattern: '^(?:[A-Za-z][A-Za-z0-9+.-]*://[^\x00-\x20\x7f]+|(?![A-Za-z][A-Za-z0-9+.-]*://)(?:[^\x00-\x20\x7f/@:]+@)?[^\x00-\x20\x7f/@:]+:[^\x00-\x20\x7f]+)$'
        annotations:
          rule: INVALID_VALUE
        description: >-
          Where git fetches another repository from, as a remote with no ASCII
          space or control character, in one of two forms: `scheme://`
          and at least one character, where the scheme is an ASCII letter
          followed by any ASCII letters, digits, `+`, `.` and `-`, such as
          `https://example.org/remote.git` or `file:///srv/remote.git`; or
          scp-like, `[user@]host:path`, where `host`, `path` and any `user`
          are non-empty, `user` and `host` hold no `/`, `@` or `:`, and the
          value doesn't start with a scheme and `://`, such as
          `git@example.org:remote.git`. The declared analysis is the one at
          the top level of that repository, at `commit`.
      commit:
        range: commit_id
        description: >-
          The full id of the commit the declared analysis is read at. A
          declaration with a `url` has one; with a `path`, it declares the
          analysis at that path as it was at that commit.
    # LinkML can't annotate the exactly_one_of list itself, so each branch
    # names the code, the same one.
    exactly_one_of:
      - slot_conditions:
          path:
            required: true
        annotations:
          rule: INVALID_DECLARATION_SOURCE
      - slot_conditions:
          url:
            required: true
        annotations:
          rule: INVALID_DECLARATION_SOURCE
    rules:
      - description: A declaration with a `url` has a `commit`.
        annotations:
          rule: URL_WITHOUT_COMMIT
        preconditions:
          slot_conditions:
            url:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            commit:
              value_presence: PRESENT

  # --- Analysis ---

  Analysis:
    tree_root: true
    description: >-
      An analysis: the files it reads, the artefacts it makes and the
      decisions it makes along the way. It is the content of an
      `astra.yaml` file.
    attributes:
      spec_version:
        range: spec_version
        required: true
        description: >-
          The version of the ASTRA specification the document is written
          against, such as `0.1.0`.
      label:
        description: A short display name for the analysis.
      description:
        description: What the analysis does, in free prose.
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: Keywords for grouping and finding the analysis.
      inputs:
        range: Input
        multivalued: true
        inlined: true
        description: The files the analysis reads, keyed by id.
      outputs:
        range: Output
        multivalued: true
        inlined: true
        required: true
        minimum_cardinality: 1
        description: >-
          The artefacts the analysis makes, and its switches, keyed by id.
          There is at least one.
      decisions:
        range: Decision
        multivalued: true
        inlined: true
        description: The choices the analysis makes, keyed by id.
      analyses:
        range: AnalysisDeclaration
        multivalued: true
        inlined: true
        description: >-
          The analyses this analysis uses, keyed by the id it addresses them
          by.
      universes:
        range: Universe
        multivalued: true
        inlined: true
        description: >-
          The universes of the analysis, and the universes of other analyses
          it imports, keyed by id. An import has an `analysis` and a
          `universe`.
      prior_insights:
        range: Insight
        multivalued: true
        inlined: true
        description: >-
          What earlier work establishes and the analysis builds on, as
          insights keyed by id. Options cite them in their `insights`.
      findings:
        range: Insight
        multivalued: true
        inlined: true
        description: What the analysis concludes, as insights keyed by id.
