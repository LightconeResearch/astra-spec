---
id: https://w3id.org/astra/view
name: view
description: |-
  The view: an analysis and every analysis of its stack as written, with
  every address resolved, the universes in which results are built, and the
  planned results.
# Placeholder version. The real version is injected at build time from the
# latest git tag (or RELEASE_VERSION) — see `_stage-versioned` in the justfile.
version: 0.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  astra: https://w3id.org/astra/
  linkml: https://w3id.org/linkml/

default_prefix: astra
default_range: string

imports:
  - linkml:types
  - results
  - analysis

classes:

  Reference:
    description: >-
      One address written in an `astra.yaml`, and what it resolves to.
    attributes:
      pointer:
        required: true
        description: >-
          A JSON Pointer to where the address is written in the file: the
          value or, for a key of a universe's `decisions`, the entry.
      element:
        range: Element
        inlined: true
        required: true
        description: The element the address names.
      pin:
        range: Element
        inlined: true
        description: The universe a reference's pin names.
      option:
        range: id
        description: >-
          The id of the option a condition, an option reference or a
          selection names.
      negated:
        range: boolean
        description: >-
          Whether a condition starts with `~`. Left out where it doesn't.

  AnalysisView:
    is_a: Identity
    description: >-
      One analysis of the stack: its file as written, and its addresses
      resolved.
    attributes:
      url:
        description: The URL of the remote the analysis is read from, if any.
      file:
        required: true
        description: >-
          The analysis's `astra.yaml`, as a path from the top of the tree it
          is read in.
      address:
        required: true
        description: >-
          The ids of the declarations by which the driving analysis first
          reaches the analysis, joined by `.`, such as `stage.inner`. The
          driving analysis's is the empty string.
      fields:
        range: Analysis
        inlined: true
        required: true
        description: The content of the analysis's `astra.yaml`, as written.
      refs:
        range: Reference
        multivalued: true
        inlined_as_list: true
        required: true
        description: >-
          Every address the file writes, in the order of their places.

  DecisionState:
    description: A decision in a universe.
    attributes:
      analysis:
        range: Identity
        inlined: true
        required: true
        description: The analysis the decision is in.
      id:
        range: id
        required: true
        description: The decision's id.
      active:
        range: boolean
        description: >-
          Whether the decision is active in the universe. Left out where its
          `when` tests a decision the universe doesn't set.
      selected:
        range: id
        description: >-
          The id of the option the universe selects. Left out where it selects
          none.

  OutputState:
    description: An output in a universe.
    attributes:
      analysis:
        range: Identity
        inlined: true
        required: true
        description: The analysis the output is in.
      id:
        range: id
        required: true
        description: The output's id.
      active:
        range: boolean
        description: >-
          Whether the output is active in the universe. Left out where its
          `when` tests a decision the universe doesn't set.

  UniverseView:
    description: >-
      A universe in which results are built, and the stack as it is there.
    attributes:
      analysis:
        range: Identity
        inlined: true
        required: true
        description: The analysis whose universe it is.
      id:
        range: id
        required: true
        description: The universe's id in its analysis.
      built:
        range: Identity
        multivalued: true
        inlined_as_list: true
        required: true
        description: >-
          The analyses built in the universe: its own, then each that its
          analysis's universes drive.
      decisions:
        range: DecisionState
        multivalued: true
        inlined_as_list: true
        required: true
        description: Each decision of the analyses built in the universe.
      outputs:
        range: OutputState
        multivalued: true
        inlined_as_list: true
        required: true
        description: Each output of the analyses built in the universe.

  View:
    tree_root: true
    description: An analysis and its stack, as tools read them.
    attributes:
      shape:
        required: true
        equals_string: astra-view/1
        description: The name and version of this shape.
      root:
        required: true
        description: >-
          The driving analysis's `astra.yaml`, as a path from the top of the
          repository that holds it.
      analyses:
        range: AnalysisView
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
        description: The analyses of the stack, the driving analysis first.
      universes:
        range: UniverseView
        multivalued: true
        inlined_as_list: true
        required: true
        description: >-
          The universes in which results are built, the driving analysis's
          first.
      results:
        range: Result
        multivalued: true
        inlined_as_list: true
        required: true
        description: The planned results, each after every result it reads.
