---
id: https://w3id.org/astra/types
name: types
description: |-
  The named types of ASTRA: the ids, addresses, references and conditions the
  format is built from, and the forms of commit ids, content hashes,
  specification versions and timestamps.
# Placeholder version. The real version is injected at build time from the
# latest git tag (or RELEASE_VERSION) — see `_stage-versioned` in the justfile.
version: 0.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  astra: https://w3id.org/astra/
  linkml: https://w3id.org/linkml/

default_prefix: astra
default_range: string

imports:
  - linkml:types

# The id grammar, written once: the structured patterns below are built from it.
# Every pattern ends in `$(?!\n)`, because Python's `$` also matches before a
# final newline and ECMA-262's does not.
settings:
  id: "[a-z][a-z0-9_]*"

types:

  id:
    typeof: string
    description: >-
      An id: a lowercase ASCII letter, then any number of lowercase ASCII
      letters, digits and underscores, such as `seed_42`.
    structured_pattern:
      syntax: '^{id}$(?!\n)'
      interpolated: true

  address:
    typeof: string
    description: >-
      The address of an element: the ids of the declared analyses that lead to
      it, if any, then the element's own id, joined by `.`, such as
      `iris.random_seed`.
    structured_pattern:
      syntax: '^{id}(\.{id})*$(?!\n)'
      interpolated: true

  reference:
    typeof: string
    description: >-
      A reference to an element: its address, optionally followed by `#` and a
      universe id, which pins the reference to that universe, such as
      `f1_score#rf_standard`.
    structured_pattern:
      syntax: '^{id}(\.{id})*(#{id})?$(?!\n)'
      interpolated: true

  option_reference:
    typeof: string
    description: >-
      A reference to an option: the address of its decision, then `.` and the
      option's id. The last segment is always the option, so
      `iris.random_seed.seed_42` is the option `seed_42` of the decision
      `random_seed` of the declared analysis `iris`.
    structured_pattern:
      syntax: '^{id}(\.{id})+$(?!\n)'
      interpolated: true

  condition:
    typeof: string
    description: >-
      An option reference, optionally preceded by `~`. Without `~` it holds
      when that option is selected; with `~` it holds when that option is not
      selected.
    structured_pattern:
      syntax: '^~?{id}(\.{id})+$(?!\n)'
      interpolated: true

  commit_id:
    typeof: string
    description: >-
      A full git commit id: 40 lowercase hexadecimal digits (SHA-1) or 64
      (SHA-256).
    pattern: "^([0-9a-f]{40}|[0-9a-f]{64})$(?!\\n)"

  content_hash:
    typeof: string
    description: >-
      A SHA-256 digest of content: `sha256:` followed by 64 lowercase
      hexadecimal digits.
    pattern: "^sha256:[0-9a-f]{64}$(?!\\n)"

  spec_version:
    typeof: string
    description: >-
      A version of the ASTRA specification, `MAJOR.MINOR.PATCH`: three
      non-negative integers without leading zeros, joined by `.`, such as
      `0.1.0`.
    pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$(?!\\n)"

  timestamp:
    typeof: string
    description: >-
      A UTC date and time to the millisecond, `YYYY-MM-DDTHH:MM:SS.sssZ`, such
      as `2026-10-26T14:00:00.000Z`.
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$(?!\\n)"
