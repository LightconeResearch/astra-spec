---
id: https://w3id.org/astra/insight
name: insight
description: |-
  Insight and evidence models with W3C Web Annotation-compliant selectors
  for referencing content in scientific papers and analysis artifacts.
# Placeholder version. The real version is injected at build time: the tag at
# HEAD, else `dev` (or RELEASE_VERSION) — see `_stage-versioned` in the justfile.
version: 0.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  astra: https://w3id.org/astra/
  linkml: https://w3id.org/linkml/
  dcterms: http://purl.org/dc/terms/
  oa: http://www.w3.org/ns/oa#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#

default_prefix: astra
default_range: string

imports:
  - linkml:types
  - types

# ==========================================================================
# W3C Web Annotation Selectors
# ==========================================================================

classes:

  TextQuoteSelector:
    description: >-
      W3C TextQuoteSelector for locating text in a document.
      The authoritative anchor for verification.
    class_uri: oa:TextQuoteSelector
    attributes:
      exact:
        required: true
        slot_uri: oa:exact
        description: The passage, exactly as the cited work or output writes it.
      prefix:
        slot_uri: oa:prefix
        description: ~20-100 chars before for disambiguation
      suffix:
        slot_uri: oa:suffix
        description: ~20-100 chars after for disambiguation

  FragmentSelector:
    description: >-
      A place in the cited work or output, given as a fragment identifier in
      the syntax `conforms_to` names, such as `row=5-7` in a CSV (RFC 7111).
      Without `conforms_to`, it is a PDF fragment identifier (RFC 8118 §3),
      such as `page=6`, with pages counted from 1.
    class_uri: oa:FragmentSelector
    attributes:
      value:
        required: true
        slot_uri: rdf:value
        pattern: '^([^\x00-\x20\x7f\x22#%<>\[\\\]^`{|}]|%[0-9A-Fa-f]{2})+$'
        annotations:
          rule: INVALID_VALUE
        description: >-
          The fragment identifier, without the leading `#`, such as `page=6`.
          It is non-empty, holds no ASCII space or control character and none
          of `"`, `#`, `<`, `>`, `[`, the backslash, `]`, `^`, the backtick,
          `{`, `|` and `}`, and has `%` only before two hex digits.
      conforms_to:
        slot_uri: dcterms:conformsTo
        range: iri
        description: >-
          The IRI of the specification of the fragment syntax `value` follows,
          as W3C Web Annotation gives it, such as
          `http://tools.ietf.org/rfc/rfc7111` for a CSV. Without it, `value` is
          a PDF fragment identifier (RFC 8118).

  # ==========================================================================
  # Evidence and Insights
  # ==========================================================================

  Evidence:
    description: >-
      What a claim rests on: a published work, cited by its `doi`, or an
      output, cited as an `artifact`. It has exactly one of the two, and a
      `version` only with a `doi`.
    attributes:
      doi:
        pattern: '^10\.[0-9]+(\.[0-9]+)*/(?!$)'
        annotations:
          rule: INVALID_VALUE
        description: >-
          The DOI name of the cited work, under the `10` directory: `10.`, the
          registrant code, `/` and a non-empty suffix, such as
          `10.5555/12345678`.
      artifact:
        range: reference
        description: >-
          A reference to the cited output, written as in an output's
          `inputs`. It may pin the output to a universe, the one the claim is
          about, such as `output1#u1`. A switch is cited as the case it takes,
          and each of its cases names an output other than a switch, or a
          switch like it.
      version:
        range: integer
        minimum_value: 1
        description: >-
          The version of the cited work, counted from 1, such as `2` for the
          second version of an arXiv paper.
      quote:
        range: TextQuoteSelector
        inlined: true
        description: >-
          The passage of the cited work or output the claim rests on. With a
          `location`, the passage is sought within that place.
      location:
        range: FragmentSelector
        inlined: true
        description: >-
          The place in the cited work or output the claim rests on, such as
          `page=6`.
    # LinkML can't annotate the exactly_one_of list itself, so each branch
    # names the code, the same one.
    exactly_one_of:
      - slot_conditions:
          doi:
            required: true
        annotations:
          rule: INVALID_EVIDENCE_SOURCE
      - slot_conditions:
          artifact:
            required: true
        annotations:
          rule: INVALID_EVIDENCE_SOURCE
    rules:
      - description: Evidence without a `doi` has no `version`.
        annotations:
          rule: INVALID_EVIDENCE_SOURCE
        preconditions:
          slot_conditions:
            doi:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            version:
              value_presence: ABSENT

  Insight:
    description: >-
      A unit of scientific knowledge backed by evidence.
      Used for both prior_insights (informing decisions) and
      findings (conclusions from the analysis).
    attributes:
      id:
        key: true
        range: id
        description: >-
          The insight's id, written as its key in `prior_insights` or
          `findings`.
      label:
        description: >-
          Short human-readable name for compact rendering
          (margin glyphs, breadcrumbs, card titles). Optional;
          tooling falls back to id when absent.
      claim:
        required: true
        description: What the insight asserts.
      description:
        description: The reasoning behind the claim, in free prose.
      evidence:
        range: Evidence
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
        description: What the claim rests on, as a list. There is at least one.
      scope:
        description: Applicability conditions
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: Categorization tags
