---
id: https://w3id.org/astra/insight
name: insight
description: |-
  The insights of an analysis: claims backed by evidence, which cites a
  published work by its DOI or an output by reference, and locates the
  passage it relies on with W3C Web Annotation selectors.
# Placeholder version. The real version is injected at build time from the
# latest git tag (or RELEASE_VERSION) — see `_stage-versioned` in the justfile.
version: 0.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  astra: https://w3id.org/astra/
  linkml: https://w3id.org/linkml/
  dcterms: http://purl.org/dc/terms/
  oa: http://www.w3.org/ns/oa#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#

default_prefix: astra
default_range: string

imports:
  - linkml:types
  - types

classes:

  # --- Selectors (W3C Web Annotation) ---

  TextQuoteSelector:
    description: >-
      A passage of the cited work or output, quoted exactly, with the text
      just before and after it to tell it apart where the same words occur
      more than once.
    class_uri: oa:TextQuoteSelector
    attributes:
      exact:
        required: true
        slot_uri: oa:exact
        description: The passage, exactly as the cited work or output writes it.
      prefix:
        slot_uri: oa:prefix
        description: The text that comes just before the passage.
      suffix:
        slot_uri: oa:suffix
        description: The text that comes just after the passage.

  FragmentSelector:
    description: >-
      A place in the cited work or output, given as a fragment identifier in
      the syntax `conforms_to` names, such as `row=5-7` in a CSV (RFC 7111).
      Without `conforms_to`, it is a PDF fragment identifier (RFC 8118 §3),
      such as `page=6`, with pages counted from 1.
    class_uri: oa:FragmentSelector
    attributes:
      value:
        required: true
        slot_uri: rdf:value
        pattern: '^([^\x00-\x20\x7f"#%<>\[\\\]^`{|}]|%[0-9A-Fa-f]{2})+$'
        annotations:
          rule: INVALID_VALUE
        description: >-
          The fragment identifier, without the leading `#`, such as `page=6`.
          It is non-empty, holds no ASCII space or control character and none
          of `"`, `#`, `<`, `>`, `[`, `\`, `]`, `^`, the backtick, `{`, `|`
          and `}`, and has `%` only before two hex digits.
      conforms_to:
        slot_uri: dcterms:conformsTo
        range: iri
        description: >-
          The IRI of the specification of the fragment syntax `value` follows,
          as W3C Web Annotation gives it, such as
          `http://tools.ietf.org/rfc/rfc7111` for a CSV. Without it, `value` is
          a PDF fragment identifier (RFC 8118).

  # --- Insights and evidence ---

  Evidence:
    description: >-
      What a claim rests on: a published work, cited by its `doi`, or an
      output, cited as an `artifact`. It has exactly one of the two, and a
      `version` only with a `doi`.
    attributes:
      doi:
        pattern: '^10\.[0-9]+(\.[0-9]+)*/(?!$)'
        annotations:
          rule: INVALID_VALUE
        description: >-
          The DOI name of the cited work, under the `10` directory: `10.`, the
          registrant code, `/` and a non-empty suffix, such as
          `10.5555/12345678`.
      artifact:
        range: reference
        description: >-
          A reference to the cited output, written as in an output's
          `inputs`. It may pin the output to a universe, the one the claim is
          about, such as `output1#u1`.
      version:
        range: integer
        minimum_value: 1
        description: >-
          The version of the cited work, counted from 1, such as `2` for the
          second version of an arXiv paper.
      quote:
        range: TextQuoteSelector
        inlined: true
        description: >-
          The passage of the cited work or output the claim rests on. With a
          `location`, the passage is sought within that place.
      location:
        range: FragmentSelector
        inlined: true
        description: >-
          The place in the cited work or output the claim rests on, such as
          `page=6`.
    # LinkML can't annotate the exactly_one_of list itself, so each branch
    # names the code, the same one.
    exactly_one_of:
      - slot_conditions:
          doi:
            required: true
        annotations:
          rule: INVALID_EVIDENCE_SOURCE
      - slot_conditions:
          artifact:
            required: true
        annotations:
          rule: INVALID_EVIDENCE_SOURCE
    rules:
      - description: Evidence without a `doi` has no `version`.
        annotations:
          rule: INVALID_EVIDENCE_SOURCE
        preconditions:
          slot_conditions:
            doi:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            version:
              value_presence: ABSENT

  Insight:
    description: >-
      A claim backed by evidence: as a prior insight, what earlier work
      establishes and the analysis builds on; as a finding, what the analysis
      concludes.
    attributes:
      id:
        key: true
        range: id
        description: >-
          The insight's id, written as its key in `prior_insights` or
          `findings`.
      label:
        description: A short display name for the insight.
      claim:
        required: true
        description: What the insight asserts.
      description:
        description: The reasoning behind the claim, in free prose.
      evidence:
        range: Evidence
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
        description: What the claim rests on, as a list. There is at least one.
      scope:
        description: The conditions under which the claim holds, in free prose.
      tags:
        multivalued: true
        minimum_cardinality: 1
        description: Keywords for grouping and finding the insight.
