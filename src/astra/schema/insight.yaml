---
id: https://w3id.org/astra/insight
name: insight
description: |-
  The insights of an analysis: claims backed by evidence, which cites a
  published work by its DOI or an output by reference, and locates the
  passage it relies on with W3C Web Annotation selectors.
# Placeholder version. The real version is injected at build time from the
# latest git tag (or RELEASE_VERSION) — see `_stage-versioned` in the justfile.
version: 0.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  astra: https://w3id.org/astra/
  linkml: https://w3id.org/linkml/
  oa: http://www.w3.org/ns/oa#

default_prefix: astra
default_range: string

imports:
  - linkml:types
  - types

classes:

  # --- Selectors (W3C Web Annotation) ---

  TextQuoteSelector:
    description: >-
      A passage of the cited work, quoted exactly, with the text just before
      and after it to tell it apart where the same words occur more than once.
    class_uri: oa:TextQuoteSelector
    attributes:
      exact:
        required: true
        description: The passage, exactly as the cited work writes it.
      prefix:
        description: The text that comes just before the passage.
      suffix:
        description: The text that comes just after the passage.

  FragmentSelector:
    description: >-
      A place in a PDF, given as a PDF fragment identifier (RFC 3778), such as
      `page=6`.
    class_uri: oa:FragmentSelector
    attributes:
      value:
        required: true
        description: >-
          The PDF fragment identifier (RFC 3778), without the leading `#`,
          such as `page=6`.

  # --- Insights and evidence ---

  Evidence:
    description: >-
      What a claim rests on: a published work, cited by its `doi`, or an
      output, cited as an `artifact`. It has exactly one of the two, and a
      `version` only with a `doi`.
    attributes:
      doi:
        pattern: '^10\.[0-9]{4,}/[^\x00-\x20\x7f]+$(?!\n)'
        description: >-
          The DOI of the cited work, such as `10.48550/arXiv.1706.03762`.
      artifact:
        range: reference
        description: >-
          A reference to the cited output, written as in an output's
          `inputs`. Evidence citing an output built per universe pins it to
          the universe its claim is about, such as `f1_score#svm_standard`.
      version:
        range: integer
        minimum_value: 1
        description: >-
          The version of the cited work, counted from 1, such as `2` for the
          second version of an arXiv paper.
      quote:
        range: TextQuoteSelector
        inlined: true
        description: The passage of the cited work the claim rests on.
      location:
        range: FragmentSelector
        inlined: true
        description: >-
          The place in the cited work the claim rests on, such as `page=6`.
    exactly_one_of:
      - slot_conditions:
          doi:
            required: true
      - slot_conditions:
          artifact:
            required: true
    rules:
      - description: Evidence without a `doi` has no `version`.
        preconditions:
          slot_conditions:
            doi:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            version:
              value_presence: ABSENT

  Insight:
    description: >-
      A claim backed by evidence: as a prior insight, what earlier work
      establishes and the analysis builds on; as a finding, what the analysis
      concludes.
    attributes:
      id:
        key: true
        range: id
        description: >-
          The insight's id, written as its key in `prior_insights` or
          `findings`.
      label:
        description: A short display name for the insight.
      claim:
        required: true
        description: What the insight asserts, in one or two sentences.
      description:
        description: The reasoning behind the claim, in free prose.
      evidence:
        range: Evidence
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
        description: What the claim rests on, as a list. There is at least one.
      scope:
        description: The conditions under which the claim holds, in free prose.
      tags:
        multivalued: true
        description: Keywords for grouping and finding the insight.
